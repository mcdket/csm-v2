<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pointage — Contract Social Manager</title>
<link rel="icon" type="image/webp" href="../shared/200.webp">
<link rel="apple-touch-icon" href="../shared/200.webp">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D9822E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14181D;
  --panel:#1B2129;
  --panel-raised:#232B35;
  --line:#2C333C;
  --line-soft:#242A32;
  --text:#F1F3F6;
  --text-muted:#8B94A3;
  --accent:#D9822E;
  --accent-strong:#A85A15;
  --brand-yellow:#F0B94A;
  --brand-yellow-strong:#D89B2E;
  --ok-bg:#DCEEE1;  --ok-fg:#1E7A46;  --ok-line:#3DAE72;
  --warn-bg:#FFF2C6;--warn-fg:#8A5A00;--warn-line:#FFC72C;
  --crit-bg:#FBDAD3;--crit-fg:#8C2A17;--crit-line:#DA291C;
  --brk-bg:#D9E8FB; --brk-fg:#1E4F8C; --brk-line:#3D8EE8;
  --shadow:0 4px 20px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:linear-gradient(180deg, var(--bg) 0%, #0B0E12 100%);
  color:var(--text);
  font-family:'Space Grotesk',-apple-system,sans-serif;
  min-height:100vh;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;}
input{font-family:inherit;}

/* ---------- Layout ---------- */
.shell{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  padding:0 20px 100px;
  display:flex;
  flex-direction:column;
}

/* ---------- Topbar ---------- */
.topbar{
  background:linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
  border-bottom:5px solid var(--brand-yellow);
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  color:#fff;
  box-shadow:var(--shadow);
}
.topbar .arches{
  width:40px;height:40px;flex:none;border-radius:50%;
  display:block;object-fit:cover;
  border:2px solid rgba(255,255,255,0.85);
  box-shadow:0 1px 4px rgba(0,0,0,0.35);
}
.topbar .titles{flex:1;min-width:0;}
.topbar h1{margin:0;font-size:17px;font-weight:800;}
.topbar .sub{
  font-size:11px;
  color:var(--brand-yellow);
  text-transform:uppercase;
  letter-spacing:.06em;
  font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar .clock{
  font-family:'IBM Plex Mono',monospace;
  font-size:18px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  text-align:right;
  line-height:1.1;
}
.topbar .conn{
  display:block;
  font-size:10px;
  opacity:0.85;
  margin-top:2px;
  font-family:'Space Grotesk',sans-serif;
  letter-spacing:.02em;
}
.topbar .conn.offline{color:#FFD2C8;}

/* ---------- Screens ---------- */
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  padding-top:24px;
}
.screen.hidden{display:none;}

/* ---------- Badge entry ---------- */
.welcome{
  text-align:center;
  margin-bottom:20px;
}
.welcome h2{
  margin:0 0 6px;
  font-size:22px;
  font-weight:700;
}
.welcome p{
  margin:0;
  color:var(--text-muted);
  font-size:14px;
  line-height:1.5;
}

.badge-display{
  background:var(--panel-raised);
  border:2px solid var(--line);
  box-shadow:var(--shadow);
  padding:24px 20px;
  text-align:center;
  margin-bottom:18px;
}
.badge-display.empty{border-style:dashed;}
.badge-display .digits{
  font-family:'IBM Plex Mono',monospace;
  font-size:56px;
  font-weight:700;
  letter-spacing:0.12em;
  line-height:1;
  min-height:56px;
  color:var(--text);
}
.badge-display.empty .digits{color:var(--line);}
.badge-display .hint{
  font-size:12px;
  color:var(--text-muted);
  margin-top:8px;
  font-weight:600;
  letter-spacing:.05em;
  text-transform:uppercase;
}

/* ---------- Keypad ---------- */
.keypad{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  margin-bottom:16px;
}
.keypad button{
  padding:20px 0;
  font-family:'IBM Plex Mono',monospace;
  font-size:28px;
  font-weight:700;
  background:var(--panel-raised);
  color:var(--text);
  border:2px solid var(--line);
  box-shadow:0 2px 0 var(--line);
  transition:transform .06s ease, background .12s ease;
}
.keypad button:hover{background:var(--panel);}
.keypad button:active{transform:translateY(2px);box-shadow:0 0 0 var(--line);background:var(--accent);color:#fff;}
.keypad button.tool{font-size:20px;background:var(--panel);}
.keypad button.tool.clear{color:var(--crit-fg);}
.keypad button.tool.back{color:var(--text-muted);}

/* ---------- Big action button ---------- */
.bigbtn{
  width:100%;
  padding:22px 16px;
  font-size:18px;
  font-weight:800;
  letter-spacing:0.01em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:12px;
  transition:transform .06s ease, filter .15s ease, background .15s ease;
  border:2px solid transparent;
}
.bigbtn:active{transform:translateY(2px);}
.bigbtn svg{width:22px;height:22px;flex:none;}
.bigbtn[disabled]{opacity:.45;pointer-events:none;}
.bigbtn.primary{background:var(--brand-yellow);color:var(--accent-strong);border-color:var(--brand-yellow-strong);}
.bigbtn.primary:hover{background:var(--brand-yellow-strong);}
.bigbtn.clockin{background:var(--ok-line);color:#FFF;border-color:#2E9A5E;}
.bigbtn.clockin:hover{filter:brightness(1.06);}
.bigbtn.break{background:var(--warn-line);color:#3A2500;border-color:#D9A800;}
.bigbtn.break:hover{filter:brightness(1.06);}
.bigbtn.return{background:var(--brk-line);color:#FFF;border-color:#2E76C4;}
.bigbtn.return:hover{filter:brightness(1.06);}
.bigbtn.end{background:var(--panel-raised);color:var(--crit-fg);border-color:var(--crit-line);font-size:16px;padding:16px;}
.bigbtn.end:hover{background:var(--crit-bg);}
.bigbtn.ghost{background:var(--panel);color:var(--text);border-color:var(--line);font-size:15px;padding:14px;}
.bigbtn.ghost:hover{border-color:var(--accent);}

/* ---------- Person card (after badge) ---------- */
.person{
  background:var(--panel-raised);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:16px;
}
.person-head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}
.person .avatar{
  width:64px;height:64px;flex:none;border-radius:50%;
  object-fit:cover;border:3px solid var(--accent);
  background:var(--panel);
}
.person .avatar-fallback{
  width:64px;height:64px;flex:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:#fff;
  font-size:26px;font-weight:700;
  border:3px solid var(--accent);
}
.person .who{flex:1;min-width:0;}
.person .name{font-size:22px;font-weight:800;line-height:1.15;}
.person .badge-info{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  color:var(--text-muted);
  margin-top:3px;
}
.status-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.status-pill.ok  {background:var(--ok-bg);  color:var(--ok-fg);}
.status-pill.warn{background:var(--warn-bg);color:var(--warn-fg);}
.status-pill.crit{background:var(--crit-bg);color:var(--crit-fg);}
.status-pill.brk {background:var(--brk-bg); color:var(--brk-fg);}
.status-pill.done{background:var(--line-soft);color:var(--text-muted);}
.status-pill .dot{width:7px;height:7px;background:currentColor;}

.timeline{
  display:flex;
  flex-direction:column;
  gap:8px;
  border-top:1px solid var(--line-soft);
  padding-top:14px;
  margin-top:6px;
}
.tline{
  display:flex;justify-content:space-between;
  font-size:14px;
}
.tline .lbl{color:var(--text-muted);font-weight:600;}
.tline .val{font-family:'IBM Plex Mono',monospace;font-weight:700;}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.stat{
  background:var(--panel);
  border:1px solid var(--line);
  padding:12px;
  text-align:center;
}
.stat .lbl{
  font-size:11px;
  color:var(--text-muted);
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.stat .val{
  font-family:'IBM Plex Mono',monospace;
  font-size:20px;
  font-weight:700;
  margin-top:4px;
}

.continue-block{
  background:var(--panel);
  border:1px solid var(--line);
  padding:14px;
  margin-top:12px;
  text-align:center;
}
.continue-block .lbl{
  font-size:11px;
  color:var(--text-muted);
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.continue-block .big{
  font-family:'IBM Plex Mono',monospace;
  font-size:28px;
  font-weight:700;
  margin-top:4px;
}
.continue-block.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-fg);}
.continue-block.crit{border-color:var(--crit-line);background:var(--crit-bg);color:var(--crit-fg);}
.continue-block.warn .lbl,.continue-block.crit .lbl{color:currentColor;opacity:.75;}
.continue-block .threshold{
  font-size:12px;
  margin-top:6px;
  color:var(--text-muted);
  font-weight:600;
}
.continue-block.warn .threshold,.continue-block.crit .threshold{color:currentColor;opacity:.85;}

.break-timer{
  background:var(--brk-bg);
  color:var(--brk-fg);
  padding:16px;
  margin-top:12px;
  text-align:center;
  border:1px solid var(--brk-line);
}
.break-timer.over{background:var(--crit-bg);color:var(--crit-fg);border-color:var(--crit-line);}
.break-timer .lbl{
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  opacity:.85;
}
.break-timer .val{
  font-family:'IBM Plex Mono',monospace;
  font-size:34px;
  font-weight:700;
  margin-top:2px;
}

/* ---------- Confirmation toast ---------- */
.confirm{
  position:fixed;
  inset:0;
  background:rgba(20,24,29,0.96);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
  text-align:center;
}
.confirm.show{display:flex;}
.confirm-inner{max-width:420px;}
.confirm .check{
  width:96px;height:96px;
  margin:0 auto 20px;
  border-radius:50%;
  background:var(--ok-line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 8px rgba(61,174,114,0.20);
}
.confirm .check svg{width:52px;height:52px;color:#fff;}
.confirm.crit .check{background:var(--crit-line);box-shadow:0 0 0 8px rgba(218,41,28,0.20);}
.confirm .msg{
  font-size:22px;
  font-weight:700;
  line-height:1.35;
  margin-bottom:8px;
}
.confirm .sub-msg{
  font-size:15px;
  color:var(--text-muted);
  font-family:'IBM Plex Mono',monospace;
  margin-bottom:26px;
}
.confirm .countdown{
  font-size:13px;
  color:var(--text-muted);
  font-weight:600;
  letter-spacing:.05em;
}
.confirm .progress{
  width:200px;height:4px;
  background:var(--line);
  margin:14px auto 0;
  overflow:hidden;
}
.confirm .progress .bar{
  height:100%;
  background:var(--accent);
  width:100%;
  transform-origin:left;
  transform:scaleX(1);
  transition:transform 1s linear;
}

/* ---------- Error banner ---------- */
.errbanner{
  background:var(--crit-bg);
  color:var(--crit-fg);
  border:1px solid var(--crit-line);
  padding:12px 14px;
  font-size:14px;
  font-weight:600;
  margin-bottom:14px;
  text-align:center;
}
.errbanner.hidden{display:none;}

.footer{
  text-align:center;
  font-size:11px;
  color:var(--text-muted);
  padding:24px 0 8px;
  opacity:.7;
}

@media (max-width:400px){
  .badge-display .digits{font-size:44px;min-height:44px;}
  .keypad button{padding:16px 0;font-size:24px;}
  .person .name{font-size:19px;}
  .topbar h1{font-size:15px;}
}

@media (min-height:800px) and (min-width:500px){
  .badge-display .digits{font-size:64px;min-height:64px;}
  .keypad button{padding:24px 0;font-size:30px;}
}
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <img class="arches" src="../shared/200.webp" alt="McDonald's">
    <div class="titles">
      <h1>Pointage</h1>
      <div class="sub" id="restLabel">Chargement…</div>
    </div>
    <div>
      <div class="clock mono" id="clockNow">--:--</div>
      <span class="conn" id="connState">Connexion…</span>
    </div>
  </div>

  <!-- ============ ÉCRAN 1 : SAISIE DU BADGE ============ -->
  <div class="screen" id="screenBadge">
    <div class="welcome">
      <h2>Bonjour</h2>
      <p>Entrez votre numéro de badge pour pointer.</p>
    </div>

    <div class="errbanner hidden" id="errBanner"></div>

    <div class="badge-display empty" id="badgeDisplay">
      <div class="digits mono" id="badgeDigits">— — — —</div>
      <div class="hint">N° de badge</div>
    </div>

    <div class="keypad">
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="tool clear" data-key="clear">C</button>
      <button data-key="0">0</button>
      <button class="tool back" data-key="back">⌫</button>
    </div>

    <button class="bigbtn primary" id="btnContinue">
      Continuer
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- ============ ÉCRAN 2 : ACTIONS ============ -->
  <div class="screen hidden" id="screenActions">
    <div class="person">
      <div class="person-head">
        <img class="avatar hidden" id="pAvatarImg" alt="">
        <div class="avatar-fallback" id="pAvatarFallback">—</div>
        <div class="who">
          <div class="name" id="pName">—</div>
          <div class="badge-info" id="pBadge">Badge —</div>
        </div>
      </div>
      <div style="text-align:center;margin-bottom:6px;">
        <span class="status-pill done" id="pStatus"><span class="dot"></span><span id="pStatusText">—</span></span>
      </div>

      <div class="timeline" id="pTimeline"></div>

      <div class="stats">
        <div class="stat">
          <div class="lbl">Aujourd'hui</div>
          <div class="val" id="pToday">0h00</div>
        </div>
        <div class="stat">
          <div class="lbl">Cette semaine</div>
          <div class="val" id="pWeek">0h00</div>
        </div>
      </div>

      <div id="continueBlock"></div>
      <div id="breakTimer"></div>
    </div>

    <div id="actionButtons"></div>

    <button class="bigbtn ghost" id="btnCancel" style="margin-top:20px;">
      ← Annuler (autre employé)
    </button>
  </div>
</div>

<!-- Confirmation overlay -->
<div class="confirm" id="confirmOverlay">
  <div class="confirm-inner">
    <div class="check" id="confirmCheck">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <div class="msg" id="confirmMsg">Arrivée pointée</div>
    <div class="sub-msg mono" id="confirmSub">08:02</div>
    <div class="countdown" id="confirmCountdown">Retour dans 9s…</div>
    <div class="progress"><div class="bar" id="confirmBar"></div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/rules-helpers.js"></script>
<script>
(function(){
  'use strict';

  const $ = function(id){ return document.getElementById(id); };
  const R = window.CSMRules;
  const AUTO_LOGOUT_SECONDS = 5;

  // ---------- State ----------
  let currentBadge = null;
  let currentStaff = null;
  let currentShift = null;
  let unsubShift = null;
  let tickTimer = null;
  let confirmTimer = null;
  let confirmCountdown = 0;
  let badgeBuffer = '';
  let weekdayTotalCache = 0;

  // ---------- Boot ----------
  auth.onAuthStateChanged(function(user){
    if(!user){ window.location.replace('login.html'); return; }
    return CSM.ready.then(function(){
      $('restLabel').textContent = CSM.restaurantName || CSM.restaurantId;
      bindKeypad();
      bindActions();
      startClock();
      checkConnection();
      restoreLastBadge();
    });
  });

  // ---------- Clock + connection indicator ----------
  function startClock(){
    function tick(){
      const d = new Date();
      $('clockNow').textContent =
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    tick();
    setInterval(tick, 1000);
  }

  function checkConnection(){
    function update(){
      const on = navigator.onLine;
      const el = $('connState');
      el.textContent = on ? 'En ligne' : 'Hors ligne';
      el.classList.toggle('offline', !on);
    }
    update();
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
  }

  function restoreLastBadge(){
    try{
      const last = localStorage.getItem('csm_last_badge');
      if(last && /^\d{1,10}$/.test(last)){
        badgeBuffer = last;
        paintBadge();
      }
    }catch(e){}
  }

  // ---------- Keypad ----------
  function bindKeypad(){
    document.querySelectorAll('.keypad button').forEach(function(b){
      b.addEventListener('click', function(){
        const k = b.dataset.key;
        if(k === 'clear'){ badgeBuffer = ''; }
        else if(k === 'back'){ badgeBuffer = badgeBuffer.slice(0, -1); }
        else if(/^\d$/.test(k)){
          if(badgeBuffer.length < 10) badgeBuffer += k;
        }
        paintBadge();
        hideErr();
      });
    });
    $('btnContinue').addEventListener('click', submitBadge);
    document.addEventListener('keydown', function(e){
      if($('screenBadge').classList.contains('hidden')) return;
      if(/^\d$/.test(e.key)){
        if(badgeBuffer.length < 10) badgeBuffer += e.key;
        paintBadge();
      } else if(e.key === 'Backspace'){
        badgeBuffer = badgeBuffer.slice(0, -1);
        paintBadge();
      } else if(e.key === 'Enter'){
        submitBadge();
      } else if(e.key === 'Escape'){
        badgeBuffer = ''; paintBadge();
      }
    });
  }

  function paintBadge(){
    const display = $('badgeDisplay');
    const digits = $('badgeDigits');
    if(badgeBuffer.length === 0){
      digits.textContent = '— — — —';
      display.classList.add('empty');
    } else {
      // Show with padding for a clean look
      const padded = badgeBuffer.length >= 4
        ? badgeBuffer
        : badgeBuffer.padStart(4, '·').replace(/·/g, '·');
      digits.textContent = badgeBuffer.split('').join(' ');
      display.classList.remove('empty');
    }
    $('btnContinue').disabled = badgeBuffer.length < 1;
  }

  function showErr(msg){
    $('errBanner').textContent = msg;
    $('errBanner').classList.remove('hidden');
  }
  function hideErr(){
    $('errBanner').classList.add('hidden');
  }

  // ---------- Submit badge ----------
  async function submitBadge(){
    if(badgeBuffer.length < 1) return;
    hideErr();
    const badge = badgeBuffer;
    try{
      const staffSnap = await CSM.refs.staff(badge).get();
      if(!staffSnap.exists){
        showErr('Badge inconnu. Demandez à votre responsable.');
        badgeBuffer = '';
        paintBadge();
        return;
      }
      const staff = staffSnap.data();
      if(staff.active === false){
        showErr('Ce badge est désactivé. Contactez votre responsable.');
        badgeBuffer = '';
        paintBadge();
        return;
      }
      try{ localStorage.setItem('csm_last_badge', badge); }catch(e){}

      currentBadge = badge;
      currentStaff = staff;
      showActionsScreen();
    }catch(err){
      showErr('Erreur de connexion : ' + err.message);
    }
  }

  // ---------- Actions screen ----------
  function showActionsScreen(){
    $('screenBadge').classList.add('hidden');
    $('screenActions').classList.remove('hidden');
    $('pName').textContent = currentStaff.name || ('Badge ' + currentBadge);
    $('pBadge').textContent = 'Badge ' + currentBadge;

    // Avatar
    if(currentStaff.photo){
      $('pAvatarImg').src = currentStaff.photo;
      $('pAvatarImg').classList.remove('hidden');
      $('pAvatarFallback').classList.add('hidden');
    } else {
      $('pAvatarImg').classList.add('hidden');
      $('pAvatarFallback').textContent =
        ((currentStaff.name || '?').trim().charAt(0) || '?').toUpperCase();
      $('pAvatarFallback').classList.remove('hidden');
    }

    subscribeToTodayShift();
    loadWeekHours();
  }

  function subscribeToTodayShift(){
    if(unsubShift) unsubShift();
    const today = R.todayKey();
    unsubShift = CSM.refs.shifts()
      .where('badge', '==', String(currentBadge))
      .where('date', '==', today)
      .limit(1)
      .onSnapshot(function(snap){
        currentShift = snap.empty ? null : Object.assign({ _id: snap.docs[0].id }, snap.docs[0].data());
        renderActions();
        startTicker();
      }, function(err){
        showErr('Sync : ' + err.message);
      });
  }

  async function loadWeekHours(){
    try{
      const keys = R.weekKeys();
      const snap = await CSM.refs.shifts()
        .where('badge', '==', String(currentBadge))
        .where('date', '>=', keys[0])
        .where('date', '<=', keys[6])
        .get();
      let total = 0;
      snap.forEach(function(d){
        total += d.data().totalMinutes || 0;
      });
      weekdayTotalCache = total;
      $('pWeek').textContent = R.fmtHrs(total);
    }catch(err){
      console.warn('Week hours:', err);
      $('pWeek').textContent = '—';
    }
  }

  function startTicker(){
    if(tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(renderActions, 1000);
    renderActions();
  }

  // ---------- Render the action screen ----------
  function renderActions(){
    const shift = currentShift;
    const calc = shift ? R.computeShift(shift) : null;

    // Status pill
    const pill = $('pStatus');
    const statusText = $('pStatusText');
    const meta = shift
      ? statusMeta(calc.status)
      : { pill: 'done', label: 'Pas encore pointé' };
    pill.className = 'status-pill ' + meta.pill;
    statusText.textContent = shift ? calc.statusLabel : 'Pas encore pointé';

    // Timeline
    const tl = $('pTimeline');
    if(shift){
      tl.innerHTML =
        tline('Arrivée', R.minToHM(shift.clockIn)) +
        tline('Départ pause', R.minToHM(shift.breakStart)) +
        tline('Retour pause', R.minToHM(shift.breakReturn)) +
        tline('Sortie', R.minToHM(shift.clockOut));
    } else {
      tl.innerHTML = '';
    }

    // Today's hours
    $('pToday').textContent = shift ? R.fmtHrs(calc.totalMinutes) : '0h00';

    // Continue block (only if clocked in and not clocked out)
    const cb = $('continueBlock');
    const bt = $('breakTimer');
    cb.innerHTML = '';
    bt.innerHTML = '';

    if(shift && shift.clockIn != null && (shift.clockOut == null)){
      if(calc.status === 'break' || calc.status === 'breakover'){
        // Live break timer
        const remaining = R.BREAK_MIN - calc.elapsedBreakMinutes;
        const isOver = remaining <= 0;
        bt.innerHTML =
          '<div class="break-timer ' + (isOver ? 'over' : '') + '">' +
            '<div class="lbl">' + (isOver ? 'Pause dépassée' : 'Pause en cours') + '</div>' +
            '<div class="val">' +
              (isOver ? '+' + fmtMin(Math.abs(remaining)) : fmtMin(remaining)) +
            '</div>' +
          '</div>';
      } else {
        // Continuous time since last break/reset
        const cont = calc.contMinutes;
        let cls = '';
        if(cont >= R.CRIT_MIN) cls = 'crit';
        else if(cont >= R.WARN_MIN) cls = 'warn';

        let threshold = '';
        if(cont < R.WARN_MIN) threshold = 'Prochain seuil : 4h30 (dans ' + fmtMin(R.WARN_MIN - cont) + ')';
        else if(cont < R.CRIT_MIN) threshold = 'Limite 4h50 dans ' + fmtMin(R.CRIT_MIN - cont);
        else threshold = 'Limite dépassée — pause immédiate requise';

        cb.innerHTML =
          '<div class="continue-block ' + cls + '">' +
            '<div class="lbl">Temps continu</div>' +
            '<div class="big">' + fmtMin(cont) + '</div>' +
            '<div class="threshold">' + threshold + '</div>' +
          '</div>';
      }
    }

    // Action buttons
    renderActionButtons(shift);
  }

  function renderActionButtons(shift){
    const zone = $('actionButtons');
    zone.innerHTML = '';

    const ICON_CLOCKIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
    const ICON_BREAK   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><path d="M6 1v3M10 1v3M14 1v3"/></svg>';
    const ICON_RETURN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
    const ICON_END     = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>';

    if(!shift){
      // No shift today → Arrivée
      const b = document.createElement('button');
      b.className = 'bigbtn clockin';
      b.innerHTML = ICON_CLOCKIN + ' Pointer mon arrivée';
      b.addEventListener('click', function(){ doAction('in', b); });
      zone.appendChild(b);
      return;
    }

    if(shift.clockOut != null){
      // Day already over
      zone.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:15px;font-weight:600;">Journée terminée — à demain !</div>';
      return;
    }

    if(shift.breakStart == null){
      // Working → Pause (primary) + Fin (secondary)
      const bPause = document.createElement('button');
      bPause.className = 'bigbtn break';
      bPause.innerHTML = ICON_BREAK + ' Départ en pause';
      bPause.addEventListener('click', function(){ doAction('break', bPause); });
      zone.appendChild(bPause);

      const bEnd = document.createElement('button');
      bEnd.className = 'bigbtn end';
      bEnd.innerHTML = ICON_END + ' Fin de journée';
      bEnd.addEventListener('click', function(){ doAction('end', bEnd); });
      zone.appendChild(bEnd);
      return;
    }

    if(shift.breakReturn == null){
      // On break → Retour (blocked until 30 min elapsed)
      const elapsed = calc(shift);
      const canReturn = elapsed.elapsedBreakMinutes >= R.BREAK_MIN;
      const remainingMin = Math.max(0, R.BREAK_MIN - elapsed.elapsedBreakMinutes);

      const bReturn = document.createElement('button');
      bReturn.className = 'bigbtn return';
      bReturn.innerHTML = ICON_RETURN + (canReturn
        ? ' Retour de pause'
        : ' Pause en cours (' + Math.ceil(remainingMin) + ' min restantes)');
      bReturn.disabled = !canReturn;
      bReturn.addEventListener('click', function(){ doAction('return', bReturn); });
      zone.appendChild(bReturn);

      const bEnd = document.createElement('button');
      bEnd.className = 'bigbtn end';
      bEnd.innerHTML = ICON_END + ' Fin de journée';
      bEnd.addEventListener('click', function(){ doAction('end', bEnd); });
      zone.appendChild(bEnd);
      return;
    }

    // Post-break, still working → Fin
    const bEnd = document.createElement('button');
    bEnd.className = 'bigbtn end';
    bEnd.innerHTML = ICON_END + ' Fin de journée';
    bEnd.addEventListener('click', function(){ doAction('end', bEnd); });
    zone.appendChild(bEnd);
  }

  function calc(shift){
    return R.computeShift(shift);
  }

  function tline(lbl, val){
    return '<div class="tline"><span class="lbl">' + lbl + '</span>' +
           '<span class="val">' + (val || '—') + '</span></div>';
  }

  function statusMeta(status){
    return ({
      ok:        {pill: 'ok'},
      warn:      {pill: 'warn'},
      crit:      {pill: 'crit'},
      break:     {pill: 'brk'},
      breakover: {pill: 'crit'},
      done:      {pill: 'done'},
      nodata:    {pill: 'done'}
    })[status] || {pill: 'done'};
  }

  function fmtMin(m){
    if(m === null || m === undefined || isNaN(m)) return '—';
    m = Math.max(0, Math.round(m));
    const h = Math.floor(m / 60), r = m % 60;
    if(h === 0) return r + 'min';
    return h + 'h' + String(r).padStart(2, '0');
  }

  // ---------- Actions ----------
  function bindActions(){
    $('btnCancel').addEventListener('click', function(){
      cancelToBadge();
    });
  }

  async function doAction(kind, btn){
    if(btn && btn.disabled) return;
    if(btn) btn.disabled = true;

    const nowMin = R.nowMinutes();
    const today = R.todayKey();
    const badge = String(currentBadge);

    try{
      if(kind === 'in'){
        // Create a new shift doc
        const payload = {
          badge: badge,
          name: currentStaff.name || '',
          date: today,
          clockIn: nowMin,
          breakStart: null,
          breakReturn: null,
          clockOut: null,
          totalMinutes: 0,
          status: 'open',
          source: 'punch',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        await CSM.refs.shifts().add(payload);
        showConfirm('Arrivée pointée', R.minToHM(nowMin), false);
      }
      else if(kind === 'break'){
        await CSM.refs.shift(currentShift._id).update({
          breakStart: nowMin,
          updatedAt: new Date().toISOString()
        });
        showConfirm('Départ en pause', R.minToHM(nowMin), false);
      }
      else if(kind === 'return'){
        await CSM.refs.shift(currentShift._id).update({
          breakReturn: nowMin,
          updatedAt: new Date().toISOString()
        });
        showConfirm('Retour de pause', R.minToHM(nowMin), false);
      }
      else if(kind === 'end'){
        // Recompute total from final state
        const merged = Object.assign({}, currentShift, { clockOut: nowMin });
        const finalCalc = R.computeShift(merged);
        await CSM.refs.shift(currentShift._id).update({
          clockOut: nowMin,
          totalMinutes: finalCalc.totalMinutes,
          status: 'closed',
          updatedAt: new Date().toISOString()
        });
        showConfirm('Fin de journée', R.minToHM(nowMin) + ' · ' + R.fmtHrs(finalCalc.totalMinutes), false);
      }
    }catch(err){
      console.error('doAction:', err);
      showErr('Erreur : ' + err.message);
      if(btn) btn.disabled = false;
    }
  }

  // ---------- Confirmation overlay with 9s countdown ----------
  function showConfirm(msg, sub, isCrit){
    const overlay = $('confirmOverlay');
    $('confirmMsg').textContent = msg;
    $('confirmSub').textContent = sub;
    overlay.classList.toggle('crit', !!isCrit);
    overlay.classList.add('show');

    // Reset progress bar
    const bar = $('confirmBar');
    bar.style.transition = 'none';
    bar.style.transform = 'scaleX(1)';
    // Force reflow
    void bar.offsetWidth;
    bar.style.transition = 'transform ' + AUTO_LOGOUT_SECONDS + 's linear';
    bar.style.transform = 'scaleX(0)';

    confirmCountdown = AUTO_LOGOUT_SECONDS;
    $('confirmCountdown').textContent = 'Retour dans ' + confirmCountdown + 's…';

    if(confirmTimer) clearInterval(confirmTimer);
    confirmTimer = setInterval(function(){
      confirmCountdown--;
      if(confirmCountdown <= 0){
        clearInterval(confirmTimer);
        confirmTimer = null;
        cancelToBadge(true);
        return;
      }
      $('confirmCountdown').textContent = 'Retour dans ' + confirmCountdown + 's…';
    }, 1000);
  }

  // ---------- Cancel / return to badge entry ----------
  function cancelToBadge(fromConfirm){
    if(confirmTimer){ clearInterval(confirmTimer); confirmTimer = null; }
    $('confirmOverlay').classList.remove('show');

    if(unsubShift){ unsubShift(); unsubShift = null; }
    if(tickTimer){ clearInterval(tickTimer); tickTimer = null; }

    currentBadge = null;
    currentStaff = null;
    currentShift = null;
    badgeBuffer = '';
    paintBadge();
    hideErr();

    $('screenActions').classList.add('hidden');
    $('screenBadge').classList.remove('hidden');

    if(fromConfirm){
      // Small delay so the finger leaves the screen before keypad is live
      setTimeout(function(){
        // Ready for next person
      }, 200);
    }
  }

})();
</script>
  <script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
