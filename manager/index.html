<!DOCTYPE html>
<html lang="fr" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointages — CSM</title>
<link rel="icon" type="image/webp" href="../shared/200.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
.app{max-width:1440px;margin:0 auto;padding:20px 20px 60px;}

.header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--panel-raised);border-bottom:3px solid var(--accent);box-shadow:0 3px 0 rgba(201,162,39,0.55), var(--shadow);padding:16px 20px;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.brand .arch{width:34px;height:34px;object-fit:cover;border-radius:50%;border:2px solid #FFF;}
.brand h1{font-size:21px;font-weight:700;margin:0;color:var(--accent);}
.controls{display:flex;gap:8px;flex-wrap:wrap;}
.liveclock{display:flex;flex-direction:column;line-height:1;}
.liveclock .lbl{font-size:9.5px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;margin-bottom:2px;}
.liveclock #clockNow{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;letter-spacing:-0.02em;}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4, 1fr);gap:10px;margin-bottom:18px;}
.stat-box{background:var(--panel-raised);border:1px solid var(--line);padding:14px;text-align:center;box-shadow:var(--shadow);}
.stat-box .num{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;line-height:1;color:var(--text);}
.stat-box .lbl{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-top:4px;}
.stat-box.active .num{color:var(--status-ok-fg);}
.stat-box.break .num{color:var(--status-break-fg);}
.stat-box.finished .num{color:var(--text-muted);}

.filterbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.filter-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.filter-btn{border:1px solid var(--line);background:var(--panel);color:var(--text-muted);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.filter-btn.active{background:var(--accent);color:#FFF;border-color:var(--accent);}
.search-box{display:flex;align-items:center;background:var(--panel-raised);border:1px solid var(--line);padding:4px 10px;min-width:240px;}
.search-box svg{width:14px;height:14px;color:var(--text-muted);margin-right:6px;}
.search-box input{border:none;background:transparent;color:var(--text);font-size:12px;width:100%;outline:none;}

.tablewrap{border:1px solid var(--line);overflow-x:auto;background:var(--panel);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;min-width:1100px;}
thead th{text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0;}
tbody td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
tbody td.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
tbody td.name{font-weight:600;white-space:normal;}
tbody td.post{font-weight:700;color:var(--accent-strong);text-transform:uppercase;font-size:11.5px;}
tbody tr{border-left:4px solid transparent;}
tbody tr.st-ok{border-left-color:var(--status-ok-line);}
tbody tr.st-warn{border-left-color:var(--status-warn-line);background:var(--status-warn-bg);}
tbody tr.st-crit{border-left-color:var(--status-crit-line);background:var(--status-crit-bg);}
tbody tr.st-break{border-left-color:var(--status-break-line);background:var(--status-break-bg);}
tbody tr.st-breakover{border-left-color:var(--status-break-line);background:var(--status-break-bg);}
tbody tr.st-done{opacity:0.55;}

.action-group{display:flex;gap:6px;}
.btn-action{padding:7px 12px;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--panel-raised);color:var(--text);cursor:pointer;font-family:inherit;}
.btn-action.break-btn{background:var(--brand-yellow);color:#2A1400;border-color:#A9850F;}
.btn-action.return-btn{background:var(--status-ok-line);color:#FFF;border-color:var(--status-ok-line);}
.btn-action.out-btn{color:var(--accent);border-color:var(--accent);}
.rowedit{border:1px solid var(--line);background:transparent;color:var(--text-muted);width:26px;height:26px;cursor:pointer;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font-size:11px;font-weight:700;border-radius:2px;}
.pill.ok{background:var(--status-ok-bg);color:var(--status-ok-fg);}
.pill.warn{background:var(--status-warn-bg);color:var(--status-warn-fg);}
.pill.crit{background:var(--status-crit-bg);color:var(--status-crit-fg);}
.pill.brk{background:var(--status-break-bg);color:var(--status-break-fg);}
.pill.done{background:var(--panel);color:var(--text-muted);}
.pilldot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* PRINT STYLES */
@media print {
  body { background: #fff; color: #000; }
  .header, .stats-bar, .filterbar, .controls, .action-group, .rowedit, .footnote, .alertstrip { display: none !important; }
  .app { padding: 0; max-width: 100%; }
  .tablewrap { border: none; box-shadow: none; overflow: visible; }
  table { min-width: 100%; border: 1px solid #000; }
  th, td { border: 1px solid #000 !important; color: #000 !important; padding: 8px !important; }
  thead th { background: #eee !important; }
  .pill { border: 1px solid #000; background: none !important; color: #000 !important; }
  tbody tr { opacity: 1 !important; background: none !important; border-left: none !important; }
  tbody td.name { font-weight: bold; }
}

.modalbg{position:fixed;inset:0;background:rgba(10,12,10,0.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modalbg.show{display:flex;}
.modal{background:var(--panel-raised);border:1px solid var(--line);width:100%;max-width:440px;padding:20px;box-shadow:var(--shadow);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
.field input{width:100%;padding:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
</style>
</head>
<body>

<div class="app" id="app" style="display:none;">
  <div class="header">
    <div class="brand">
      <img class="arch" src="../shared/200.webp">
      <h1>Pointages</h1>
    </div>
    <div class="controls">
      <a class="btn" href="planning.html">Planning</a>
      <a class="btn" href="staff.html">Employés</a>
      <a class="btn" href="football-field.html" style="color:var(--accent);font-weight:700;">⚽ Football Field</a>
      <a class="btn" href="daily-import.html">Importer</a>
      <button class="btn" id="btnAdd">Ajouter</button>
      <button class="btn btn-primary" id="btnPrint">Imprimer</button>
      <button class="btn" id="btnLogout">Déconnexion</button>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-box active"><div class="num" id="statActive">0</div><div class="lbl">En poste</div></div>
    <div class="stat-box break"><div class="num" id="statBreak">0</div><div class="lbl">En pause</div></div>
    <div class="stat-box finished"><div class="num" id="statFinished">0</div><div class="lbl">Terminés</div></div>
    <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
  </div>

  <div class="filterbar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">Tous</button>
      <button class="filter-btn" data-filter="working">En poste</button>
      <button class="filter-btn" data-filter="break">En pause</button>
      <button class="filter-btn" data-filter="action">Action requise</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher...">
    </div>
  </div>

  <div class="tablewrap">
    <table id="empTable">
      <thead>
        <tr>
          <th>Badge</th>
          <th>Nom</th>
          <th>Poste</th>
          <th>Entrées</th>
          <th>Sorties</th>
          <th>Heures Tot.</th>
          <th>Statut</th>
          <th>Actions</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="empBody"></tbody>
    </table>
  </div>
</div>

<div class="modalbg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Modifier</h3>
    <div class="field"><label>Badge</label><input type="text" id="fBadge"></div>
    <div class="field"><label>Nom</label><input type="text" id="fName"></div>
    <div class="modalactions">
      <button class="btn" id="btnCancel">Annuler</button>
      <button class="btn btn-primary" id="btnSave">Enregistrer</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/rules-helpers.js"></script>
<script>
(function(){
  const $ = function(id){ return document.getElementById(id); };
  const R = window.CSMRules;

  let shifts = [];
  let assignments = {}; // { badge: postName }
  let currentFilter = 'all';
  let searchQuery = '';

  auth.onAuthStateChanged(function(user){
    if(!user){ window.location.replace('login.html'); return; }
    db.collection('managerRestaurants').doc(user.uid).get().then(function(doc){
      if(!doc.exists){ auth.signOut(); return; }
      CSM.ready.then(function(){
        $('app').style.display = 'block';
        watchDailyImport();
        watchAssignments();
      });
    });
  });

  $('btnLogout').addEventListener('click', function(){ auth.signOut(); });

  function watchDailyImport(){
    CSM.refs.dailyImport('current').onSnapshot(function(doc){
      let dateIso = R.todayKey();
      if(doc.exists && doc.data().date){
        const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(doc.data().date);
        if(m) dateIso = m[3] + '-' + m[2] + '-' + m[1];
      }
      watchShiftsFor(dateIso);
    });
  }

  function watchShiftsFor(dateIso){
    CSM.refs.shifts().where('date', '==', dateIso).onSnapshot(function(snap){
      shifts = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      render();
    });
  }

  function watchAssignments(){
    // Assignments are saved as assignments/current
    CSM.refs.restaurant().collection('assignments').doc('current').onSnapshot(function(doc){
      assignments = doc.exists ? doc.data() : {};
      render();
    });
  }

  function render(){
    const body = $('empBody'); body.innerHTML = '';
    
    let activeCount = 0, breakCount = 0, doneCount = 0;
    
    const filtered = shifts.filter(s => {
      const calc = R.shiftState(s);
      if(calc.status === 'ok' || calc.status === 'warn' || calc.status === 'crit') activeCount++;
      else if(calc.status === 'break' || calc.status === 'breakover') breakCount++;
      else if(calc.status === 'done') doneCount++;

      if(currentFilter === 'working' && !(calc.status === 'ok' || calc.status === 'warn' || calc.status === 'crit')) return false;
      if(currentFilter === 'break' && !(calc.status === 'break' || calc.status === 'breakover')) return false;
      if(currentFilter === 'action' && !(calc.status === 'warn' || calc.status === 'crit')) return false;
      if(searchQuery && !(s.name||'').toLowerCase().includes(searchQuery) && !String(s.badge).includes(searchQuery)) return false;
      return true;
    });

    $('statActive').textContent = activeCount;
    $('statBreak').textContent = breakCount;
    $('statFinished').textContent = doneCount;
    $('statTotal').textContent = shifts.length;

    filtered.sort((a,b) => {
      const cA = R.shiftState(a), cB = R.shiftState(b);
      const rank = s => ({crit:0, warn:1, breakover:2, break:2, ok:3, done:4}[s] || 5);
      return rank(cA.status) - rank(cB.status);
    }).forEach(s => {
      const calc = R.shiftState(s);
      const meta = { ok:'ok', warn:'warn', crit:'crit', break:'brk', breakover:'brk', done:'done' }[calc.status] || 'done';
      const rowClass = { ok:'st-ok', warn:'st-warn', crit:'st-crit', break:'st-break', breakover:'st-breakover', done:'st-done' }[calc.status] || '';
      
      const inTxt = s.inPunches ? s.inPunches.map(m=>R.minToHM(m)).join(', ') : (R.minToHM(s.clockIn) || '—');
      const outTxt = s.outPunches ? s.outPunches.map(m=>R.minToHM(m)).join(', ') : (R.minToHM(s.clockOut) || '—');
      const post = assignments[s.badge] || '—';

      let btns = '';
      if(calc.status !== 'done'){
        if(calc.status === 'break' || calc.status === 'breakover') btns = `<button class="btn-action return-btn" data-act="return" data-id="${s.id}">Retour</button>`;
        else btns = `<button class="btn-action break-btn" data-act="break" data-id="${s.id}">Pause</button>`;
        btns += `<button class="btn-action out-btn" data-act="out" data-id="${s.id}">Sortie</button>`;
      }

      const tr = document.createElement('tr');
      tr.className = rowClass;
      tr.innerHTML = `
        <td class="mono">${s.badge}</td>
        <td class="name">${s.name||'—'}</td>
        <td class="post">${post}</td>
        <td class="mono">${inTxt}</td>
        <td class="mono">${outTxt}</td>
        <td class="mono" style="font-weight:700;color:var(--accent-strong);">${R.fmtHrs(calc.workedMinutes)}</td>
        <td><span class="pill ${meta}"><span class="pilldot"></span>${calc.statusLabel}</span></td>
        <td><div class="action-group">${btns}</div></td>
        <td><button class="rowedit" data-id="${s.id}">✎</button></td>`;
      
      tr.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => doAction(b.dataset.id, b.dataset.act)));
      tr.querySelector('.rowedit').addEventListener('click', () => alert('Edition manuelle désactivée pour le moment.'));
      body.appendChild(tr);
    });
  }

  function doAction(id, act){
    const s = shifts.find(x => x.id === id);
    const patch = {};
    const now = R.nowMinutes();

    if(act === 'break'){ patch.outPunches = (s.outPunches||[]).concat([now]); }
    else if(act === 'return'){ patch.inPunches = (s.inPunches||[]).concat([now]); }
    else if(act === 'out'){ patch.outPunches = (s.outPunches||[]).concat([now]); patch.status = 'closed'; }

    CSM.refs.shift(id).update(patch);
  }

  document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); currentFilter = b.dataset.filter; render();
  }));
  $('searchInput').addEventListener('input', e => { searchQuery = e.target.value.toLowerCase(); render(); });

  $('btnPrint').addEventListener('click', () => window.print());
  $('btnLogout').addEventListener('click', () => auth.signOut());

})();
</script>
</body>
</html>
