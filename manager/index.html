<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning — CSM</title>
<link rel="icon" type="image/webp" href="../shared/200.webp">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>

<div class="top-nav">
  <div class="nav-left">
    <div class="nav-brand">mngmt.tech</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Time Punch</a>
      <a href="planning.html" class="nav-link active">Planning</a>
      <a href="#" class="nav-link" onclick="return false;">Forecast</a>
      <a href="staff.html" class="nav-link">Staff</a>
    </div>
  </div>
  <div class="nav-right">
    <button class="nav-btn" id="btnLogout">Déconnexion</button>
  </div>
</div>

<div class="container" id="app" style="display:none;">
  
  <div class="page-header" style="border-bottom: 2px solid var(--teal); padding-bottom: 20px; margin-bottom: 20px;">
    <div class="page-title">Planning Hebdomadaire</div>
    <div class="flex gap-2">
      <button class="btn btn-secondary" id="btnPrint">Imprimer</button>
      <button class="btn btn-primary" id="dropzone">Importer le PDF</button>
      <input type="file" id="fileInput" accept="application/pdf" style="display:none;">
    </div>
  </div>
  
  <div id="importLog" style="display:none; background:#f3f4f6; padding:10px; border-radius:4px; margin-bottom:20px; font-size:14px;"></div>

  <div class="flex items-center gap-3" style="margin-bottom: 20px;">
    <div style="font-weight:600;">Semaine du</div>
    <input type="date" class="input" id="weekStart" disabled>
    <div id="weekRange" class="text-muted" style="margin-left:auto;"></div>
  </div>

  <div id="dayTabs" style="display:flex; gap:10px; margin-bottom: 20px;"></div>

  <div class="flex justify-between items-center" style="margin-bottom: 16px;">
    <div id="daySum" style="font-size:16px; font-weight:600;"></div>
    <button class="btn btn-secondary" id="btnToggleOff">👁 Afficher les employés en repos</button>
  </div>

  <div id="expectedWrap" style="display:none; background:#F0F9FA; border:1px solid #BEE3F8; border-radius:4px; padding:16px; margin-bottom:20px;">
    <div style="font-weight:700; color:var(--teal); margin-bottom:10px;">Effectif par fonction : <span class="badge badge-blue" style="background:#fff; border:1px solid #BEE3F8; color:var(--teal);">Non assigné : 1</span></div>
  </div>

  <div id="dayoffWrap" class="table-container" style="display:none; margin-bottom:20px;">
    <table><thead><tr><th>En repos aujourd'hui</th><th>Téléphone</th></tr></thead><tbody id="dayoffBody"></tbody></table>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Début</th>
          <th>Employé</th>
          <th>Téléphone</th>
          <th style="text-align:right;">Actions</th>
        </tr>
      </thead>
      <tbody id="dayList"></tbody>
    </table>
    <div id="emptyPlan" style="text-align:center; padding:40px; color:var(--text-muted); display:none;">Aucun employé prévu ce jour-là.</div>
  </div>
</div>

<!-- Modals -->
<div class="modalbg" id="editBg">
  <div class="modal">
    <h3>Modifier l'horaire</h3>
    <div class="sub" id="editSub">—</div>
    <div class="field"><label>Nom (ce jour seulement)</label><input type="text" id="editName"></div>
    <div class="flex gap-3">
      <div class="field" style="flex:1;"><label>Début</label><input type="time" id="editStart"></div>
      <div class="field" style="flex:1;"><label>Fin</label><input type="time" id="editEnd"></div>
    </div>
    <div class="modalactions">
      <button class="btn btn-secondary" id="editCancel">Annuler</button>
      <button class="btn btn-primary" id="editSave">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modalbg" id="statBg">
  <div class="modal">
    <h3>Marquer</h3>
    <div class="sub" id="statSub">—</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn btn-secondary" data-stat="absent" style="justify-content:flex-start;">Absent</button>
      <button class="btn btn-secondary" data-stat="sick" style="justify-content:flex-start; color:#D4A32A; border-color:#F3D9A4;">Maladie</button>
      <button class="btn btn-secondary" data-stat="cancelled" style="justify-content:flex-start; color:#EF4444; border-color:#FCA5A5;">Annulé</button>
      <button class="btn btn-secondary" data-stat="replaced" style="justify-content:flex-start; color:#7A4DAB; border-color:#D8B4E2;">Remplacé par…</button>
      <button class="btn btn-secondary" data-stat="clear" style="justify-content:flex-start; color:#2E7D32; border-color:#A7F3D0;">Remettre normal</button>
    </div>
    <div class="modalactions">
      <button class="btn btn-secondary" id="statCancel">Annuler</button>
    </div>
  </div>
</div>

<div class="modalbg" id="replBg">
  <div class="modal">
    <h3>Remplacé par…</h3>
    <div class="sub" id="replSub">—</div>
    <div class="field"><label>Nom</label><input type="text" id="replName"></div>
    <div class="modalactions">
      <button class="btn btn-secondary" id="replCancel">Annuler</button>
      <button class="btn btn-primary" id="replSave">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modalbg" id="addBg">
  <div class="modal">
    <h3>Ajouter un employé</h3>
    <div class="sub" id="addSub">—</div>
    <div class="field"><label>Nom</label><input type="text" id="addName"></div>
    <div class="flex gap-3">
      <div class="field" style="flex:1;"><label>Début</label><input type="time" id="addStart" value="09:00"></div>
      <div class="field" style="flex:1;"><label>Fin</label><input type="time" id="addEnd" value="17:00"></div>
    </div>
    <div class="modalactions">
      <button class="btn btn-secondary" id="addCancel">Annuler</button>
      <button class="btn btn-primary" id="addSave">Ajouter</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/rules-helpers.js"></script>
<script>
(function(){
  'use strict';
  const $ = function(id){ return document.getElementById(id); };
  const R = window.CSMRules;
  if(window['pdfjsLib']){ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }

  const DAY_NAMES  = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const DAY_SHORT  = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const MONTHS     = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const SCHED_DAYS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];

  const EXPECT_LEAD_MIN  = 60;
  const EXPECT_LATE_MIN  = 120;
  const EXPECT_GRACE_MIN = 5;

  let schedule = null;
  let employees = [];
  let unsubSchedule = null;
  let unsubShifts = null;
  let selDay = null;
  let timeOffsetMs = 0;
  let staffList = [];
  let showDayoff = false;

  try { timeOffsetMs = parseInt(localStorage.getItem('csct_time_offset') || '0', 10) || 0; } catch(e){}
  function appNow(){ return new Date(Date.now() + timeOffsetMs); }
  function nowMinutes(){ const d = appNow(); return d.getHours()*60 + d.getMinutes(); }

  auth.onAuthStateChanged(user => {
    if(!user) { window.location.replace('login.html'); return; }
    db.collection('managerRestaurants').doc(user.uid).get().then(doc => {
      if(!doc.exists) { auth.signOut(); return; }
      return CSM.ready.then(() => {
        $('app').style.display = 'block';
        loadStaff();
        startListeners();
        setInterval(() => { renderExpected(); renderWeek(); }, 15000);
      });
    });
  });

  $('btnLogout').addEventListener('click', () => auth.signOut());

  $('btnToggleOff').addEventListener('click', () => {
    showDayoff = !showDayoff;
    $('dayoffWrap').style.display = showDayoff ? 'block' : 'none';
    $('btnToggleOff').textContent = showDayoff ? '👁 Masquer les employés en repos' : '👁 Afficher les employés en repos';
    if(showDayoff) renderDayOff();
  });

  function loadStaff(){
    CSM.refs.staffColl().get().then(snap => {
      staffList = snap.docs.map(d => Object.assign({ _id: d.id }, d.data())).filter(s => s.active !== false);
      const opts = staffList.map(s => `<option value="${escAttr(s.name)}">${esc(s.name)} (badge ${esc(String(s.badge))})</option>`).join('');
      $('replSelect').innerHTML = '<option value="">— Choisir un employé —</option>' + opts;
      $('addSelect').innerHTML  = '<option value="">— Choisir un employé —</option>' + opts;
    });
  }

  function startListeners(){
    unsubSchedule = CSM.refs.schedules().orderBy('importedAt', 'desc').limit(1).onSnapshot(snap => {
      const prevStart = schedule && schedule.start;
      schedule = snap.empty ? null : Object.assign({ _id: snap.docs[0].id }, snap.docs[0].data());
      if(!schedule || schedule.start !== prevStart) selDay = null;
      renderAll();
    });

    const today = R.todayKey();
    unsubShifts = CSM.refs.shifts().where('date', '==', today).onSnapshot(snap => {
      employees = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      renderAll();
    });
  }

  function renderAll(){
    renderPlanSub();
    renderExpected();
    if(showDayoff) renderDayOff();
    renderWeek();
    $('addRowWrap').style.display = schedule ? 'block' : 'none';
  }

  function renderPlanSub(){
    const sub = $('planSub');
    if(!schedule) { sub.textContent = 'Aucun planning chargé. Importez le PDF ci-dessus.'; $('weekStart').value = ''; return; }
    const ti = todayIdx();
    let t = 'Planning du ' + fmtShort(schedule.start) + ' au ' + fmtShort(schedule.end);
    if(ti < 0 || ti > 6) t += ". Il ne couvre pas la date d'aujourd'hui.";
    sub.textContent = t;
    $('weekStart').value = schedule.start;
  }

  function findStaff(schedName){
    for(const s of staffList){ if(R.sameName(s.name, schedName)) return s; }
    const schedTokens = R.nameTokens(schedName);
    if(!schedTokens.length) return null;
    const significant = schedTokens.filter(t => t.length >= 3);
    if(significant.length >= 2){
      for(const s of staffList){
        const staffTokens = R.nameTokens(s.name);
        if(staffTokens.length === 1 && staffTokens[0].length >= 8){
          const single = staffTokens[0];
          if(significant.every(t => single.includes(t))) return s;
        }
      }
    }
    if(schedTokens.length === 1 && schedTokens[0].length >= 5){
      for(const s of staffList){ if(R.nameTokens(s.name).includes(schedTokens[0])) return s; }
    }
    return null;
  }

  function arrivedFor(emp){
    const key = 'd' + todayIdx() + '_' + emp.n;
    if(schedule.dismissed && schedule.dismissed[key]) return true;
    const schedStaff = findStaff(emp.name);
    return employees.some(e => {
      const hasArrived = (Array.isArray(e.inPunches) && e.inPunches.length > 0) || (e.clockIn !== null && e.clockIn !== undefined);
      if(!hasArrived) return false;
      if(schedStaff && String(e.badge) === String(schedStaff.badge)) return true;
      return R.sameName(emp.name, e.name);
    });
  }

  function renderDayOff(){
    const list = $('dayoffBody'); list.innerHTML = '';
    if(!schedule) return;
    const ti = todayIdx();
    if(ti < 0 || ti > 6) return;
    const onRest = (schedule.employees || []).filter(emp => { const sh = emp.d && emp.d[ti]; return !sh || !sh.s; });
    if(!onRest.length) { list.innerHTML = '<tr><td colspan="2" class="text-muted">Tout le monde travaille aujourd\'hui.</td></tr>'; return; }
    onRest.sort((a,b) => String(a.name).localeCompare(String(b.name), 'fr'));
    onRest.forEach(emp => {
      const staff = findStaff(emp.name);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td style="font-weight:600;">${emp.name}</td><td class="mono">${staff && staff.phone ? staff.phone : '—'}</td>`;
      list.appendChild(tr);
    });
  }

  function renderExpected(){
    const wrap = $('expectedWrap');
    if(!schedule) { wrap.style.display = 'none'; return; }
    const ti = todayIdx();
    if(ti < 0 || ti > 6) { wrap.style.display = 'none'; return; }

    const nowMin = nowMinutes();
    let items = [];
    (schedule.employees || []).forEach(emp => {
      const sh = emp.d && emp.d[ti];
      if(!sh || sh.st) return;
      const dt = toMin(sh.s) - nowMin;
      if(dt > 60 || dt < -120) return;
      if(arrivedFor(emp)) return;
      items.push({ emp, sh });
    });
    
    if(!items.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    // Keep simple layout for expected
    wrap.innerHTML = `<div style="font-weight:700; color:var(--teal);">Attendus prochainement (${items.length})</div>`;
  }

  function renderWeek(){
    const tabs = $('dayTabs'); tabs.innerHTML = '';
    const list = $('dayList'); list.innerHTML = '';
    
    if(!schedule){
      $('daySum').textContent = 'Aucun planning chargé.';
      $('weekRange').textContent = '';
      $('btnPrint').disabled = true;
      $('emptyPlan').style.display = 'block';
      return;
    }
    $('weekRange').textContent = fmtShort(schedule.start) + ' → ' + fmtShort(schedule.end);

    const ti = todayIdx();
    if(selDay === null) selDay = (ti >= 0 && ti <= 6) ? ti : 0;

    for(let i=0; i<7; i++){
      const d = dayDate(i);
      const b = document.createElement('button');
      const isSelected = (i === selDay);
      b.style.flex = '1'; b.style.padding = '12px';
      b.style.border = '1px solid var(--border-light)'; b.style.borderRadius = '4px';
      b.style.background = isSelected ? 'var(--teal)' : '#FFFFFF';
      b.style.color = isSelected ? '#FFFFFF' : 'var(--text-main)';
      b.style.fontWeight = isSelected ? '600' : '500';
      b.style.textAlign = 'center'; b.style.cursor = 'pointer';
      b.innerHTML = `<div style="font-size:12px; text-transform:uppercase;">${DAY_SHORT[i]}</div><div style="font-size:16px;">${d.getUTCDate()}</div>`;
      b.addEventListener('click', () => { selDay = i; renderWeek(); });
      tabs.appendChild(b);
    }

    const isToday = selDay === ti;
    const nowMin = nowMinutes();
    const rows = [];
    (schedule.employees || []).forEach(emp => {
      const sh = emp.d && emp.d[selDay];
      if(sh) rows.push({ emp, sh });
    });
    rows.sort((a,b) => toMin(a.sh.s) - toMin(b.sh.s) || a.emp.name.localeCompare(b.emp.name));

    const d = dayDate(selDay);
    $('daySum').textContent = DAY_NAMES[selDay] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' : ' + rows.length + ' employés prévus';

    if(!rows.length){
      $('emptyPlan').style.display = 'block';
    } else {
      $('emptyPlan').style.display = 'none';
      rows.forEach(r => {
        const staff = findStaff(r.sh.ov || r.emp.name);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="mono" style="color:var(--teal); font-weight:600; font-size:15px;">${r.sh.s}</td>
          <td style="font-weight:600;">${r.sh.ov || r.emp.name}</td>
          <td class="mono">${staff && staff.phone ? staff.phone : '—'}</td>
          <td style="text-align:right;">
            <button class="btn btn-secondary btn-sm" onclick="openEditModal('${r.emp.n}')">✎</button>
            <button class="btn btn-secondary btn-sm" onclick="openStatusModal('${r.emp.n}')">⊘</button>
          </td>
        `;
        list.appendChild(tr);
      });
    }
  }

  function dismissExpected(key){
    if(!schedule || !schedule._id) return;
    const newDismissed = Object.assign({}, schedule.dismissed || {});
    newDismissed[key] = true;
    CSM.refs.schedules().doc(schedule._id).update({ dismissed: newDismissed });
  }

  // --- Modals ---
  let editing = null;
  let statTarget = null;
  let replTarget = null;

  window.openEditModal = function(empN){
    const emp = (schedule.employees || []).find(x => x.n == empN);
    if(!emp) return;
    const sh = emp.d[selDay];
    editing = { empIndex: schedule.employees.indexOf(emp), dayIndex: selDay, emp, sh };
    $('editSub').textContent = emp.name + ' — ' + DAY_NAMES[selDay];
    $('editName').value = sh.ov || emp.name;
    $('editStart').value = sh.s || '';
    $('editEnd').value = sh.e || '';
    $('editBg').classList.add('show');
  }
  $('editCancel').addEventListener('click', () => $('editBg').classList.remove('show'));
  $('editSave').addEventListener('click', async () => {
    if(!editing) return;
    const current = (schedule.employees || []).slice();
    const emp = Object.assign({}, current[editing.empIndex]);
    emp.d = Object.assign({}, emp.d);
    const sh = Object.assign({}, emp.d[editing.dayIndex] || {});
    
    const newName = $('editName').value.trim();
    if(newName && newName !== emp.name) sh.ov = newName; else delete sh.ov;
    sh.s = $('editStart').value; sh.e = $('editEnd').value;
    emp.d[editing.dayIndex] = sh; current[editing.empIndex] = emp;
    
    await CSM.refs.schedules().doc(schedule._id).update({ employees: current });
    $('editBg').classList.remove('show');
  });

  window.openStatusModal = function(empN){
    const emp = (schedule.employees || []).find(x => x.n == empN);
    if(!emp) return;
    const sh = emp.d[selDay];
    statTarget = { empIndex: schedule.employees.indexOf(emp), dayIndex: selDay, emp, sh };
    $('statSub').textContent = emp.name + ' — ' + DAY_NAMES[selDay];
    $('statBg').classList.add('show');
  }
  $('statCancel').addEventListener('click', () => $('statBg').classList.remove('show'));
  document.querySelectorAll('#statBg .statbtn button').forEach(b => {
    b.addEventListener('click', () => {
      const stat = b.dataset.stat;
      if(!statTarget) return;
      if(stat === 'replaced') {
        replTarget = statTarget; statTarget = null;
        $('statBg').classList.remove('show');
        $('replSub').textContent = replTarget.emp.name + ' — ' + DAY_NAMES[replTarget.dayIndex];
        $('replName').value = '';
        $('replBg').classList.add('show');
        return;
      }
      applyStatus(stat === 'clear' ? null : stat, null);
    });
  });
  $('replCancel').addEventListener('click', () => $('replBg').classList.remove('show'));
  $('replSave').addEventListener('click', () => {
    if(!replTarget) return;
    const name = $('replName').value.trim();
    if(!name) { alert('Nom requis.'); return; }
    const t = replTarget; replTarget = null; statTarget = t;
    applyStatus('replaced', name);
    $('replBg').classList.remove('show');
  });

  async function applyStatus(stat, replName){
    if(!statTarget) return;
    const current = (schedule.employees || []).slice();
    const emp = Object.assign({}, current[statTarget.empIndex]);
    emp.d = Object.assign({}, emp.d);
    const sh = Object.assign({}, emp.d[statTarget.dayIndex] || {});
    if(!stat) { delete sh.st; delete sh.rn; }
    else { sh.st = stat; if(stat === 'replaced') sh.rn = replName; else delete sh.rn; }
    emp.d[statTarget.dayIndex] = sh; current[statTarget.empIndex] = emp;
    
    await CSM.refs.schedules().doc(schedule._id).update({ employees: current });
    $('statBg').classList.remove('show');
  }

  // --- PDF Logic ---
  async function extractItems(arrayBuffer){
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const pages = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      pages.push(content.items.filter(i => typeof i.str === 'string').map(i => ({ str: i.str, x: i.transform[4], y: -i.transform[5], w: i.width })));
    }
    return pages;
  }

  function parseSchedule(pages){
    let start = null, end = null, prevCols = null, prevNameX = null;
    const employees = [];
    const dmy = s => { const m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(s); return m ? m[3]+'-'+m[2]+'-'+m[1] : null; };

    pages.forEach(page => {
      const toks = [];
      page.forEach(it => {
        if(!it.str || !it.str.trim()) return;
        const re = /\S+/g; let m;
        while((m = re.exec(it.str))){
          const x = it.x + it.w * (m.index / it.str.length);
          const w = it.w * (m[0].length / it.str.length);
          toks.push({ t: m[0], x, w, c: x + w/2, y: it.y });
        }
      });
      if(!toks.length) return;

      if(!start){
        const text = toks.slice().sort((a,b) => (Math.round(a.y)-Math.round(b.y)) || (a.x-b.x)).map(t => t.t).join(' ');
        const m = /from\s+(\d{2}\/\d{2}\/\d{4})\s+to\s+(\d{2}\/\d{2}\/\d{4})/i.exec(text);
        if(m){ start = dmy(m[1]); end = dmy(m[2]); }
      }

      const hdr = {};
      toks.forEach(t => { const di = SCHED_DAYS.indexOf(t.t.toLowerCase()); if(di >= 0 && !hdr[di]) hdr[di] = t; });
      let cols = null, hdrY = null, nameX = prevNameX;
      if(Object.keys(hdr).length === 7){
        cols = SCHED_DAYS.map((_,i) => hdr[i].x); hdrY = hdr[0].y;
        const nt = toks.find(t => t.t === 'Name' && Math.abs(t.y - hdrY) < 4);
        if(nt) nameX = nt.x;
        prevCols = cols; prevNameX = nameX;
      } else if(prevCols){ cols = prevCols; hdrY = -1e9; }
      if(!cols || nameX == null) return;
      const colW = (cols[6] - cols[0]) / 6;

      const body = toks.filter(t => t.y > hdrY + 3);
      const anchors = body.filter(t => /^\d{1,3}$/.test(t.t) && t.c < nameX - 2).sort((a,b) => a.y - b.y);
      if(!anchors.length) return;
      const rows = anchors.map(a => ({ n: +a.t, y: a.y, lines: {}, cells: [[],[],[],[],[],[],[]] }));

      body.forEach(t => {
        if(anchors.indexOf(t) >= 0) return;
        let bi = 0, bd = 1e9;
        rows.forEach((r, i) => { const d = Math.abs(r.y - t.y); if(d < bd){ bd = d; bi = i; } });
        if(bd > 22) return;
        const r = rows[bi];
        if(/^\d{1,2}:\d{2}\*?$/.test(t.t)){
          let ci = Math.floor((t.c - cols[0] + colW*0.1) / colW);
          if(ci >= 0 && ci <= 6) r.cells[ci].push(t);
        } else if(t.x >= nameX - 3 && t.x < cols[0] - 3){
          const key = Math.round(t.y / 3);
          (r.lines[key] = r.lines[key] || []).push(t);
        }
      });

      rows.forEach(r => {
        const lineKeys = Object.keys(r.lines).map(Number).sort((a,b) => a-b);
        let name = '';
        lineKeys.forEach(k => {
          const words = r.lines[k].sort((a,b) => a.x-b.x).map(t => t.t).filter(w => w !== '*' && w !== 'Blank');
          if(!words.length) return;
          const prevWords = name ? name.split(' ') : [];
          if(name && words.length === 1 && words[0].length === 1 && prevWords[prevWords.length-1].length >= 6) name += words[0];
          else name += (name ? ' ' : '') + words.join(' ');
        });
        name = name.replace(/\s+/g,' ').trim();
        if(!name) return;

        const d = {};
        r.cells.forEach((cellToks, ci) => {
          const ts = cellToks.sort((a,b) => a.x-b.x);
          if(ts.length >= 2) d[ci] = { s: ts[0].t.replace('*',''), e: ts[1].t.replace('*',''), o: /\*/.test(ts[1].t) ? 1 : 0 };
          else if(ts.length === 1) d[ci] = { s: ts[0].t.replace('*',''), e: '', o: 0 };
        });
        employees.push({ n: r.n, name, d });
      });
    });

    if(!start || !end) throw new Error("Dates du planning introuvables.");
    return { start, end, employees };
  }

  $('dropzone').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });

  async function handleFile(file){
    $('importLog').style.display = 'block'; $('importLog').textContent = 'Lecture en cours...';
    try{
      const parsed = parseSchedule(await extractItems(await file.arrayBuffer()));
      const payload = {
        start: parsed.start, end: parsed.end,
        employees: parsed.employees.filter(e => Object.keys(e.d).length > 0),
        dismissed: {}, importedAt: new Date().toISOString(), importedBy: auth.currentUser ? auth.currentUser.uid : null
      };
      await CSM.refs.schedules().add(payload);
      $('importLog').textContent = 'Planning enregistré avec succès.';
    }catch(err){
      $('importLog').textContent = 'Erreur : ' + err.message;
      alert('Import impossible : ' + err.message);
    }
  }

  // Helpers
  function toMin(hhmm){ const a = String(hhmm).split(':').map(Number); return a[0]*60 + a[1]; }
  function fmtShort(iso){ return iso.slice(8,10) + '/' + iso.slice(5,7); }
  function startParts(){ return schedule.start.split('-').map(Number); }
  function todayIdx(){
    const now = appNow(), p = startParts();
    return Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(p[0], p[1]-1, p[2])) / 86400000);
  }
  function dayDate(i){ const p = startParts(); return new Date(Date.UTC(p[0], p[1]-1, p[2] + i)); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function escAttr(s){ return esc(s); }

})();
</script>
