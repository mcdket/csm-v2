<!DOCTYPE html>
<html lang="fr" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import quotidien — CSM</title>
<link rel="icon" type="image/webp" href="../shared/200.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
.app{max-width:1240px;margin:0 auto;padding:20px 20px 60px;}
.header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--panel-raised);border-bottom:3px solid var(--accent);box-shadow:0 3px 0 rgba(201,162,39,0.55), var(--shadow);padding:16px 20px;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.brand .arch{width:34px;height:34px;object-fit:cover;border-radius:50%;border:2px solid #FFF;}
.brand h1{font-size:21px;font-weight:700;margin:0;color:var(--accent);}
.controls{display:flex;gap:8px;flex-wrap:wrap;}
.import{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;margin-bottom:20px;}
.dropzone{border:1.5px dashed var(--line);padding:36px 16px;text-align:center;color:var(--text-muted);font-size:14px;cursor:pointer;}
.dropzone:hover{border-color:var(--accent);background:var(--status-break-bg);}
.importlog{margin-top:14px;font-size:12.5px;max-height:180px;overflow-y:auto;display:none;padding-top:12px;border-top:1px solid var(--line-soft);}
.importlog.show{display:block;}
.summary{background:var(--panel-raised);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px;}
.summary-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.summary-left .date{font-size:20px;font-weight:800;font-family:'IBM Plex Mono',monospace;}
.summary-stats{display:flex;gap:10px;}
.statbox{padding:8px 14px;border:1px solid var(--line);background:var(--panel);text-align:center;min-width:96px;}
.statbox.ok{border-color:var(--status-ok-line);}
.statbox.warn{border-color:var(--status-warn-line);background:var(--status-warn-bg);}
.statbox.crit{border-color:var(--status-crit-line);background:var(--status-crit-bg);}
.statbox.new{border-color:var(--brand-yellow);background:rgba(240,185,74,0.20);}
.statbox .num{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;line-height:1;}
.statbox .lbl{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-top:4px;}
.summary-actions{display:flex;gap:10px;border-top:1px solid var(--line-soft);padding-top:14px;}
.summary-actions .btn{flex:1;}
.tablewrap{border:1px solid var(--line);background:var(--panel);overflow-x:auto;margin-bottom:16px;}
table.preview{width:100%;border-collapse:collapse;min-width:1100px;font-size:13px;}
.preview th{text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;padding:10px 12px;border-bottom:2px solid var(--line);background:var(--panel-raised);}
.preview td{padding:10px 12px;border-bottom:1px solid var(--line-soft);}
.preview tr.flagged-ok{border-left:4px solid var(--status-ok-line);}
.preview tr.flagged-warn{border-left:4px solid var(--status-warn-line);background:var(--status-warn-bg);}
.preview tr.flagged-crit{border-left:4px solid var(--status-crit-line);background:var(--status-crit-bg);}
.preview tr.flagged-new{border-left:4px solid var(--brand-yellow);background:rgba(240,185,74,0.12);}
.match-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;font-size:11.5px;font-weight:700;}
.match-pill.ok{background:var(--status-ok-bg);color:var(--status-ok-fg);}
.match-pill.warn{background:var(--status-warn-bg);color:var(--status-warn-fg);}
.match-pill.crit{background:var(--status-crit-bg);color:var(--status-crit-fg);}
.match-pill.new{background:rgba(240,185,74,0.30);color:#8A5A00;}
.picker{padding:6px 8px;font-size:12.5px;background:var(--panel);color:var(--text);border:1px solid var(--line);max-width:220px;}
.rowaction{padding:6px 10px;font-size:11.5px;font-weight:700;background:transparent;border:1px solid var(--line);cursor:pointer;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;background:var(--panel);border:1px dashed var(--line);}
.loading-overlay{position:fixed;inset:0;background:rgba(20,24,29,0.6);display:none;align-items:center;justify-content:center;z-index:150;}
.loading-overlay.show{display:flex;}
.spinner{width:48px;height:48px;border:4px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app" id="app" style="display:none;">
  <div class="header">
    <div class="brand"><img class="arch" src="../shared/200.webp"><h1>Import quotidien</h1></div>
    <div class="controls">
      <a class="btn" href="index.html">← Tableau de bord</a>
      <a class="btn" href="planning.html">Planning</a>
      <button class="btn" id="btnLogout">Déconnexion</button>
    </div>
  </div>

  <div class="import">
    <div class="dropzone" id="dropzone">
      <div><b>Déposez le PDF ici</b> ou cliquez</div>
      <input type="file" id="fileInput" accept="application/pdf" style="display:none;">
    </div>
    <div class="importlog" id="importLog"></div>
  </div>

  <div class="empty-state" id="emptyState">
    <b>Aucun aperçu en cours</b>
    Chargez un PDF ci-dessus pour voir les pointages.
  </div>

  <div id="previewWrap" style="display:none;">
    <div class="summary">
      <div class="summary-top">
        <div class="summary-left"><span class="date" id="sumDate">—</span></div>
        <div class="summary-stats" id="sumStats"></div>
      </div>
      <div class="summary-actions">
        <button class="btn" id="btnClearPreview">Effacer l'aperçu</button>
        <button class="btn btn-primary" id="btnSaveAll">✓ Sync avec la base</button>
      </div>
    </div>
    <div class="tablewrap">
      <table class="preview">
        <thead><tr><th>Badge</th><th>Nom (PDF)</th><th>Employé associé</th><th>Entrée</th><th>Pause</th><th>Retour</th><th>Sortie</th><th>Action</th></tr></thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
  </div>
</div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/rules-helpers.js"></script>
<script>
(function(){
  'use strict';
  const $ = function(id){ return document.getElementById(id); };
  const R = window.CSMRules;
  if(window['pdfjsLib']) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let staffList = [];
  let staffByBadge = {};
  let currentImport = null;
  let unsubImport = null;

  auth.onAuthStateChanged(function(user){
    if(!user){ window.location.replace('login.html'); return; }
    db.collection('managerRestaurants').doc(user.uid).get().then(function(doc){
      if(!doc.exists){ auth.signOut(); return; }
      CSM.ready.then(function(){
        $('app').style.display = 'block';
        wireImport();
        loadStaff().then(subscribeCurrentImport);
      });
    });
  });

  $('btnLogout').addEventListener('click', function(){ auth.signOut(); });

  function loadStaff(){
    return CSM.refs.staffColl().get().then(function(snap){
      staffList = []; staffByBadge = {};
      snap.forEach(function(doc){
        const s = Object.assign({ _id: doc.id }, doc.data());
        if(s.active === false) return;
        staffList.push(s); staffByBadge[String(s.badge)] = s;
      });
      staffList.sort((a,b) => String(a.name||'').localeCompare(String(b.name||''), 'fr'));
    });
  }

  function subscribeCurrentImport(){
    if(unsubImport) unsubImport();
    unsubImport = CSM.refs.dailyImport('current').onSnapshot(function(doc){
      if(doc.exists && doc.data().rows && doc.data().rows.length){
        currentImport = Object.assign({ _id: 'current' }, doc.data());
        matchAgainstStaff(); render();
      } else {
        currentImport = null; render();
      }
    });
  }

  function wireImport(){
    $('dropzone').addEventListener('click', () => $('fileInput').click());
    $('fileInput').addEventListener('change', function(e){
      if(e.target.files[0]) handleFile(e.target.files[0]);
      e.target.value = '';
    });
  }

  async function handleFile(file){
    $('loadingOverlay').classList.add('show');
    try{
      const pages = await extractPdfItems(await file.arrayBuffer());
      const parsed = parseDailyReport(pages);
      if(!parsed.rows.length) throw new Error('Aucun employé détecté.');
      
      const payload = {
        date: parsed.date, rows: parsed.rows,
        importedAt: new Date().toISOString(), importedBy: auth.currentUser.uid,
        savedAt: null, savedCount: 0
      };
      await CSM.refs.dailyImport('current').set(payload);
    }catch(err){
      alert('Import impossible : ' + err.message);
    }finally{
      $('loadingOverlay').classList.remove('show');
    }
  }

  async function extractPdfItems(arrayBuffer){
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const pages = [];
    for(let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      pages.push(content.items.filter(i => typeof i.str === 'string' && i.str.trim()).map(i => ({ str: i.str, x: i.transform[4], y: i.transform[5] })));
    }
    return pages;
  }

  const COL = { BNO:{min:30,max:55}, NAME:{min:96,max:185}, IN:{min:276,max:330}, OUT:{min:331,max:430} };
  function colOf(x){ for(const key in COL){ if(x >= COL[key].min && x <= COL[key].max) return key; } return null; }

  function parseDailyReport(pages){
    let date = null;
    if(pages[0]){
      const p1 = pages[0];
      const dateItem = p1.find(i => /^\d{2}\/\d{2}\/\d{4}$/.test(i.str) && i.y > 780);
      if(dateItem) date = dateItem.str;
    }

    const blocks = [];
    let current = null;

    pages.forEach(pageItems => {
      const headerItem = pageItems.find(i => i.str === 'Bno' && i.x >= COL.BNO.min && i.x <= COL.BNO.max);
      const headerY = headerItem ? headerItem.y : Infinity;
      
      // Sort strictly top-to-bottom, then left-to-right
      const items = pageItems.filter(i => i.y < headerY)
        .sort((a, b) => { return Math.abs(a.y - b.y) > 2 ? b.y - a.y : a.x - b.x; });

      items.forEach(it => {
        const col = colOf(it.x);
        if(col === 'BNO' && /^\d+$/.test(it.str)){
          if(current) blocks.push(current);
          current = { bno: it.str, nameParts: [], inPunches: [], outPunches: [] };
          return;
        }
        if(!current) return;
        if(col === 'NAME') current.nameParts.push(it.str);
        else if(col === 'IN'){ const m = /^(\d{1,2}):(\d{2})/.exec(it.str); if(m) current.inPunches.push(parseInt(m[1])*60 + parseInt(m[2])); }
        else if(col === 'OUT'){ const m = /^(\d{1,2}):(\d{2})/.exec(it.str); if(m) current.outPunches.push(parseInt(m[1])*60 + parseInt(m[2])); }
      });
    });
    if(current) blocks.push(current);

    const rows = blocks.map(b => {
      let name = b.nameParts.join(' ').replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
      
      // DO NOT SORT. The arrays are already in visual top-to-bottom order.
      // 1st IN is clock in, 2nd IN is break return.
      // 1st OUT is break start, 2nd OUT is clock out.
      
      let clockIn = null, breakReturn = null, clockOut = null, breakStart = null;
      
      if(b.inPunches[0] !== undefined) clockIn = b.inPunches[0];
      if(b.inPunches[1] !== undefined) breakReturn = b.inPunches[1];
      if(b.outPunches[0] !== undefined) breakStart = b.outPunches[0];
      if(b.outPunches[1] !== undefined) clockOut = b.outPunches[1];

      // Cross-midnight corrections
      if(breakReturn !== null && clockIn !== null && breakReturn < clockIn) breakReturn += 24 * 60;
      if(breakStart !== null && clockIn !== null && breakStart < clockIn && breakReturn !== null && breakReturn >= 24 * 60) breakStart += 24 * 60;
      if(clockOut !== null && clockIn !== null && clockOut < clockIn) clockOut += 24 * 60;
      if(clockOut !== null && breakReturn !== null && clockOut < breakReturn) clockOut += 24 * 60;

      return {
        rawNum: b.bno, namePdf: name,
        clockIn: clockIn, breakStart: breakStart, breakReturn: breakReturn, clockOut: clockOut,
        match: null, chosenBadge: null
      };
    }).filter(r => r.namePdf);

    return { date, rows };
  }

  function matchAgainstStaff(){
    if(!currentImport) return;
    currentImport.rows.forEach(row => {
      const bno = String(row.rawNum).trim();
      if(bno && staffByBadge[bno]){
        row.match = { badge: bno, staffName: staffByBadge[bno].name, level: R.sameName(staffByBadge[bno].name, row.namePdf) ? 'ok' : 'warn' };
      } else {
        const byName = staffList.find(s => R.sameName(s.name, row.namePdf));
        if(byName) row.match = { badge: String(byName.badge), staffName: byName.name, level: 'warn' };
        else row.match = { badge: bno, staffName: null, level: 'new' };
      }
    });
  }

  function effectiveLevel(row){ return row.chosenBadge ? 'ok' : (row.match ? row.match.level : 'crit'); }
  function chosenBadge(row){ return row.chosenBadge || (row.match && row.match.badge); }

  function render(){
    if(!currentImport){ $('previewWrap').style.display = 'none'; $('emptyState').style.display = 'block'; return; }
    $('previewWrap').style.display = 'block'; $('emptyState').style.display = 'none';
    $('sumDate').textContent = currentImport.date || '—';

    const rows = currentImport.rows;
    $('sumStats').innerHTML = 
      '<div class="statbox ok"><div class="num">'+rows.filter(r=>effectiveLevel(r)==='ok').length+'</div><div class="lbl">Reconnues</div></div>' +
      '<div class="statbox new"><div class="num">'+rows.filter(r=>effectiveLevel(r)==='new').length+'</div><div class="lbl">Nouveaux</div></div>' +
      '<div class="statbox warn"><div class="num">'+rows.filter(r=>effectiveLevel(r)==='warn').length+'</div><div class="lbl">À vérifier</div></div>';

    const body = $('previewBody'); body.innerHTML = '';
    rows.forEach((row, idx) => {
      const level = effectiveLevel(row);
      const badgeDisp = chosenBadge(row) || '—';
      
      let cellHtml = '';
      if(level === 'ok' && !row.chosenBadge) cellHtml = '<div class="match-pill ok">✓ '+esc(row.match.staffName)+'</div>';
      else if(level === 'new' && !row.chosenBadge) cellHtml = '<div class="match-pill new">+ Sera créé</div>';
      else {
        const opts = ['<option value="">— Choisir —</option>'].concat(staffList.map(s => 
          '<option value="'+s.badge+'" '+(chosenBadge(row)===String(s.badge)?'selected':'')+'>'+esc(s.name)+'</option>'
        )).join('');
        cellHtml = '<div class="match-pill '+level+'" style="margin-bottom:4px;">'+level.toUpperCase()+'</div><select class="picker" data-idx="'+idx+'">'+opts+'</select>';
      }

      const tr = document.createElement('tr');
      tr.className = 'flagged-' + level;
      tr.innerHTML = '<td class="mono"><b>'+esc(badgeDisp)+'</b></td><td class="name">'+esc(row.namePdf)+'</td><td>'+cellHtml+'</td><td class="mono">'+(R.minToHM(row.clockIn)||'—')+'</td><td class="mono">'+(R.minToHM(row.breakStart)||'—')+'</td><td class="mono">'+(R.minToHM(row.breakReturn)||'—')+'</td><td class="mono">'+(R.minToHM(row.clockOut)||'—')+'</td><td><button class="rowaction" data-idx="'+idx+'">Ignorer</button></td>';
      
      tr.querySelector('.picker')?.addEventListener('change', e => { currentImport.rows[idx].chosenBadge = e.target.value; saveDraft(); render(); });
      tr.querySelector('.rowaction')?.addEventListener('click', () => { currentImport.rows.splice(idx, 1); saveDraft(); render(); });
      body.appendChild(tr);
    });

    $('btnSaveAll').textContent = currentImport.savedAt ? '✓ Ré-enregistrer' : '✓ Sync avec la base ('+rows.length+')';
  }

  function saveDraft(){ const p = Object.assign({}, currentImport); delete p._id; CSM.refs.dailyImport('current').set(p); }

  $('btnClearPreview').addEventListener('click', () => {
    if(!confirm('Effacer l\'aperçu ?')) return;
    CSM.refs.dailyImport('current').delete();
  });

  $('btnSaveAll').addEventListener('click', async function(){
    const rows = currentImport.rows;
    if(!rows.length) return;
    this.disabled = true; this.textContent = 'Sync…'; $('loadingOverlay').classList.add('show');

    let dateIso = R.todayKey();
    if(currentImport.date){ const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(currentImport.date); if(m) dateIso = m[3]+'-'+m[2]+'-'+m[1]; }

    let saved = 0;
    for(const row of rows){
      const badge = String(chosenBadge(row));
      if(!badge) continue;

      let staff = staffByBadge[badge];
      if(!staff && effectiveLevel(row) === 'new'){
        const newStaff = { badge, name: row.namePdf, active: true, source: 'import', createdAt: new Date().toISOString() };
        await CSM.refs.staff(badge).set(newStaff); staff = newStaff;
      }

      const shiftData = { date: dateIso, inPunches: [], outPunches: [] };
      if (row.clockIn !== null) shiftData.inPunches.push(row.clockIn);
      if (row.breakReturn !== null) shiftData.inPunches.push(row.breakReturn);
      if (row.breakStart !== null) shiftData.outPunches.push(row.breakStart);
      if (row.clockOut !== null) shiftData.outPunches.push(row.clockOut);

      const state = R.shiftState(shiftData, dateIso);

      const existing = await CSM.refs.shifts().where('badge', '==', badge).where('date', '==', dateIso).get();
      const payload = {
        badge, name: staff.name || row.namePdf, date: dateIso,
        inPunches: shiftData.inPunches, outPunches: shiftData.outPunches,
        totalMinutes: state.workedMinutes, status: row.clockOut !== null ? 'closed' : 'open',
        source: 'daily-import', updatedAt: new Date().toISOString()
      };

      if(!existing.empty) await existing.docs[0].ref.update(payload);
      else { payload.createdAt = new Date().toISOString(); await CSM.refs.shifts().add(payload); }
      saved++;
    }

    currentImport.savedAt = new Date().toISOString(); currentImport.savedCount = saved;
    await saveDraft(); await loadStaff(); render();
    this.disabled = false; $('loadingOverlay').classList.remove('show');
    alert('✓ ' + saved + ' pointages synchronisés.');
  });

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
})();
</script>
</body>
</html>
