<!DOCTYPE html>
<html lang="fr" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuaire du Personnel — CSM</title>
<link rel="icon" type="image/webp" href="../shared/200.webp">
<link rel="apple-touch-icon" href="../shared/200.webp">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#067A8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
.app{max-width:1400px;margin:0 auto;padding:0;}

/* Top Nav */
.top-nav{background:var(--accent);color:#FFF;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;}
.nav-brand{font-weight:700;font-size:20px;}
.nav-links{display:flex;gap:24px;}
.nav-links a{color:#FFF;text-decoration:none;font-weight:600;font-size:14px;opacity:0.9;transition:opacity 0.2s;}
.nav-links a:hover{opacity:1;}
.nav-links a.active{opacity:1;font-weight:700;}
.btn-logout{background:transparent;border:none;color:#FFF;font-weight:600;cursor:pointer;font-size:14px;opacity:0.9;}
.btn-logout:hover{opacity:1;}

/* Page Header */
.page-header{display:flex;justify-content:space-between;align-items:center;padding:24px 20px 16px 20px;flex-wrap:wrap;gap:16px;background:var(--panel);}
.page-title{font-size:28px;font-weight:700;color:var(--accent);margin:0;display:flex;align-items:center;gap:12px;}

/* Header Controls */
.header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;background:var(--panel-raised);border:1px solid var(--line);padding:6px 12px;border-radius:4px;}
.search-box svg{width:14px;height:14px;color:var(--text-muted);margin-right:6px;flex:none;}
.search-box input{border:none;background:transparent;color:var(--text);font-size:13px;width:200px;outline:none;}

.btn-import{background:var(--panel-raised);border:1.5px solid var(--line);color:var(--text);padding:8px 16px;border-radius:4px;font-size:13px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.btn-import:hover{border-color:var(--accent);}

/* Table */
.table-wrap{padding:0 20px 20px 20px;}
.tablewrap{border:1px solid var(--line);overflow-x:auto;background:var(--panel);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;table-layout:auto;}
thead th{text-align:left;font-size:11px;font-weight:600;letter-spacing:0.03em;color:var(--text-muted);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0;}
tbody td{padding:14px 16px;font-size:14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
tbody tr:hover{background:var(--panel-raised);}
tbody td.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent-strong);font-weight:600;}
tbody td.name{font-weight:600;white-space:normal;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.02em;}
.badge-blue {background:#E0F2FE;color:#0284C7;}
.badge-green{background:#DCFCE7;color:#166534;}
.badge-red  {background:#FEE2E2;color:#991B1B;}
.badge-gray {background:#F3F4F6;color:#4B5563;}

/* Buttons */
.btn-sm {padding:4px 8px;font-size:12px;}
.btn-icon {background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:4px;}
.btn-icon:hover {color:var(--accent);}
.btn-icon.danger:hover {color:var(--status-crit-fg);}

.empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;}

/* Modals */
.modalbg{position:fixed;inset:0;background:rgba(10,12,10,0.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modalbg.show{display:flex;}
.modal{background:var(--panel-raised);border:1px solid var(--line);width:100%;max-width:440px;padding:22px;box-shadow:var(--shadow);}
.modal h3{margin:0 0 6px;font-size:17px;}
.modal .sub{font-size:12.5px;color:var(--text-muted);margin-bottom:16px;line-height:1.45;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.field input, .field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;font-family:inherit;box-sizing:border-box;}
.field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
.modalactions{display:flex;justify-content:space-between;gap:8px;margin-top:18px;}

.loading-overlay{position:fixed;inset:0;background:rgba(20,24,29,0.7);display:none;align-items:center;justify-content:center;z-index:150;flex-direction:column;gap:15px;color:#fff;}
.loading-overlay.show{display:flex;}
.spinner{width:48px;height:48px;border:4px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="app" id="app" style="display:none;">
  
  <!-- TOP NAV BAR -->
  <div class="top-nav">
    <div style="display:flex; align-items:center; gap:30px;">
      <div class="nav-brand">mngmt.tech</div>
      <div class="nav-links">
        <a href="index.html">Time Punch</a>
        <a href="planning.html">Planning</a>
        <a href="staff.html" class="active">Staff</a>
      </div>
    </div>
    <button class="btn-logout" id="btnLogout">Déconnexion</button>
  </div>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1 class="page-title">Annuaire du Personnel</h1>
    
    <div class="header-controls">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Rechercher...">
      </div>
      <button class="btn btn-primary" id="btnAdd">+ Ajouter un employé</button>
      
      <button class="btn-import" id="btnImportBase">Importer Excel</button>
      <input type="file" id="baseFileInput" accept="application/pdf" style="display:none;">
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Badge ↕</th>
            <th>Nom ↕</th>
            <th>Téléphone</th>
            <th>Fonction</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="staffBody"></tbody>
      </table>
      <div class="empty hidden" id="emptyState">
        <b>Aucun employé pour le moment</b>
      </div>
    </div>
  </div>

</div>

<div class="modalbg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Ajouter un employé</h3>
    <div class="sub" id="modalSub">Créez un profil.</div>

    <div class="field">
      <label>N° de badge</label>
      <input type="text" id="fBadge" inputmode="numeric" placeholder="4021" autocomplete="off">
    </div>

    <div class="field">
      <label>Nom & Prénom</label>
      <input type="text" id="fName" placeholder="Karim Benali" autocomplete="off">
    </div>

    <div class="field">
      <label>Numéro de téléphone</label>
      <input type="text" id="fPhone" placeholder="06 12 34 56 78" autocomplete="off">
    </div>

    <div class="field">
      <label>Fonction</label>
      <select id="fRole">
        <option value="Crew">Crew</option>
        <option value="Form">Form</option>
        <option value="GEL">GEL</option>
        <option value="Equipier Pol">Equipier Pol</option>
        <option value="Dépôt">Dépôt</option>
        <option value="Equipier">Equipier</option>
      </select>
    </div>

    <div class="modalactions">
      <button class="btn btn-danger" id="btnHardDelete" style="display:none; margin-right:auto;">Supprimer définitivement</button>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="btnCancel">Annuler</button>
        <button class="btn btn-primary" id="btnSave">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">Lecture du fichier PDF en cours...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/rules-helpers.js"></script>
<script>
(function(){
  'use strict';

  const $ = function(id){ return document.getElementById(id); };
  const R = window.CSMRules;

  if(window['pdfjsLib']){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  let staff = [];
  let unsubscribeStaff = null;
  let currentQuery = '';
  let editingBadge = null;

  let started = false;
  auth.onAuthStateChanged(function(user){
    if(!user){ window.location.replace('login.html'); return; }
    if(started) return;
    started = true;

    db.collection('managerRestaurants').doc(user.uid).get().then(function(doc){
      if(!doc.exists){
        auth.signOut().then(function(){ window.location.replace('login.html'); });
        return;
      }
      return Promise.race([
        CSM.ready,
        new Promise(function(_, reject){ setTimeout(function(){ reject(new Error('Timeout')); }, 8000); })
      ]).then(function(){
        document.querySelector('.app').style.display = 'block';
        startLiveStaff();
      });
    }).catch(function(err){
      console.error('Auth gating:', err);
      alert('Erreur de chargement : ' + err.message);
    });
  });

  $('btnLogout').addEventListener('click', function(){ auth.signOut(); });

  function startLiveStaff(){
    unsubscribeStaff = CSM.refs.staffColl()
      .onSnapshot(function(snap){
        staff = snap.docs.map(function(d){
          return Object.assign({ _docId: d.id }, d.data());
        });
        render();
      }, function(err){
        console.error('Live staff:', err);
      });
  }

  function render(){
    const body = $('staffBody');
    const empty = $('emptyState');
    body.innerHTML = '';

    let filtered = staff.slice();

    if(currentQuery.trim()){
      const q = currentQuery.toLowerCase();
      filtered = filtered.filter(function(s){
        return (s.name || '').toLowerCase().includes(q)
            || String(s.badge || '').toLowerCase().includes(q)
            || String(s.phone || '').toLowerCase().includes(q);
      });
    }

    filtered.sort(function(a,b){
      return String(a.name || '').localeCompare(String(b.name || ''), 'fr');
    });

    if(filtered.length === 0){
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    filtered.forEach(function(s){
      let roleStr = s.role || 'Crew';
      let isActive = s.active !== false;
      let statClass = isActive ? 'badge-green' : 'badge-red';
      let statLabel = isActive ? 'ACTIF' : 'INACTIF';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="mono">${escapeHtml(String(s.badge || '—'))}</td>
        <td class="name">${escapeHtml(s.name || 'Sans nom')}</td>
        <td class="mono">${escapeHtml(s.phone || '—')}</td>
        <td><span class="badge badge-blue">${escapeHtml(roleStr)}</span></td>
        <td><span class="badge ${statClass}">${statLabel}</span></td>
        <td>
          <button class="btn-icon" onclick="openEditModal('${escapeAttr(String(s.badge))}')" title="Modifier">✎</button>
          <button class="btn-icon danger" onclick="toggleActive('${escapeAttr(String(s.badge))}')" title="${isActive ? 'Désactiver' : 'Réactiver'}">🗑</button>
        </td>
      `;
      body.appendChild(tr);
    });
  }

  const modalBg = $('modalBg');

  function openAddModal(){
    editingBadge = null;
    $('modalTitle').textContent = 'Ajouter un employé';
    $('modalSub').textContent = "Créez un profil.";
    $('fBadge').value = '';
    $('fBadge').disabled = false;
    $('fName').value = '';
    $('fPhone').value = '';
    $('fRole').value = 'Crew';
    $('btnHardDelete').style.display = 'none';
    modalBg.classList.add('show');
    setTimeout(function(){ $('fBadge').focus(); }, 50);
  }

  window.openEditModal = function(badge){
    const s = staff.find(function(x){ return String(x.badge) === String(badge); });
    if(!s) return;
    editingBadge = badge;
    $('modalTitle').textContent = 'Modifier le profil';
    $('modalSub').textContent = 'Mettez à jour les informations.';
    $('fBadge').value = s.badge || badge;
    $('fBadge').disabled = true;
    $('fName').value = s.name || '';
    $('fPhone').value = s.phone || '';
    $('fRole').value = s.role || 'Crew';
    $('btnHardDelete').style.display = 'block';
    modalBg.classList.add('show');
  }

  function closeModal(){
    modalBg.classList.remove('show');
    editingBadge = null;
    $('fBadge').disabled = false;
  }

  $('btnAdd').addEventListener('click', openAddModal);
  $('btnCancel').addEventListener('click', closeModal);
  modalBg.addEventListener('click', function(e){ if(e.target === modalBg) closeModal(); });

  $('btnSave').addEventListener('click', function(){
    const badge = $('fBadge').value.trim();
    const name  = $('fName').value.trim();
    const phone = $('fPhone').value.trim();
    const role  = $('fRole').value;

    if(!badge){ alert('Le numéro de badge est requis.'); return; }
    if(!name){  alert('Le nom est requis.'); return; }
    if(!/^[0-9A-Za-z_-]{1,20}$/.test(badge)){
      alert('Le badge doit contenir uniquement des chiffres, lettres, tirets ou underscores (max 20).');
      return;
    }

    // Check for name duplicates (Case insensitive and fuzzy matching)
    const duplicateName = staff.find(s => R.sameName(s.name, name) && String(s.badge) !== String(badge));
    if (duplicateName) {
      alert('Un employé avec ce nom existe déjà (Badge : ' + duplicateName.badge + ').\n\nVeuillez utiliser un nom différent ou modifier le profil existant.');
      return;
    }

    const btn = $('btnSave');
    btn.disabled = true;

    if(editingBadge){
      CSM.refs.staff(editingBadge).update({
        name: name,
        phone: phone,
        role: role,
        updatedAt: new Date().toISOString()
      }).then(function(){
        btn.disabled = false;
        closeModal();
      }).catch(function(err){
        btn.disabled = false;
        alert('Erreur : ' + err.message);
      });
    } else {
      CSM.refs.staff(badge).get().then(function(doc){
        if(doc.exists){
          throw new Error('Un employé avec ce badge existe déjà.');
        }
        return CSM.refs.staff(badge).set({
          badge: badge,
          name: name,
          phone: phone,
          role: role,
          active: true,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          source: 'manual'
        });
      }).then(function(){
        btn.disabled = false;
        closeModal();
      }).catch(function(err){
        btn.disabled = false;
        alert('Erreur : ' + err.message);
      });
    }
  });

  $('btnHardDelete').addEventListener('click', function() {
    if(!editingBadge) return;
    if(!confirm('Voulez-vous supprimer définitivement cet employé ?\n\nAttention: Son historique de pointages restera dans la base de données, mais il sera retiré de l\'annuaire.')) return;
    
    $('btnHardDelete').disabled = true;
    CSM.refs.staff(editingBadge).delete().then(() => {
      closeModal();
    }).catch(err => {
      $('btnHardDelete').disabled = false;
      alert('Erreur : ' + err.message);
    });
  });

  window.toggleActive = function(badge){
    const s = staff.find(function(x){ return String(x.badge) === String(badge); });
    if(!s) return;
    const willDeactivate = s.active !== false;
    if(willDeactivate){
      const ok = confirm(
        'Désactiver ' + (s.name || badge) + ' ?\n\n' +
        "L'employé ne pourra plus pointer, et disparaîtra des vues actives."
      );
      if(!ok) return;
    }
    CSM.refs.staff(badge).update({
      active: !willDeactivate,
      updatedAt: new Date().toISOString()
    }).catch(function(err){
      alert('Erreur : ' + err.message);
    });
  }

  $('searchInput').addEventListener('input', function(e){
    currentQuery = e.target.value;
    render();
  });

  // ============================================================
  // Master Database Import (PDF)
  // ============================================================
  
  $('btnImportBase').addEventListener('click', () => $('baseFileInput').click());
  
  $('baseFileInput').addEventListener('change', async function(e){
    if(!e.target.files[0]) return;
    
    $('loadingOverlay').classList.add('show');
    $('btnImportBase').disabled = true;
    
    try {
      const file = e.target.files[0];
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      
      let created = 0;
      let updated = 0;
      let skipped = 0;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        
        const lineMap = new Map();
        content.items.forEach(item => {
          if (!item.str.trim()) return;
          const y = Math.round(item.transform[5]);
          if (!lineMap.has(y)) lineMap.set(y, []);
          lineMap.get(y).push(item);
        });

        const sortedY = Array.from(lineMap.keys()).sort((a, b) => b - a);
        
        for (const y of sortedY) {
          const rowItems = lineMap.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
          const rowString = rowItems.map(it => it.str).join(' ');

          const regex = /^(\d+)(.+?)NT\s*(\d{2}\/\d{2}\/\d{4})\s*(\d{2}:\d{2}:\d{2})([\d\s]*)$/;
          const match = regex.exec(rowString);

          if (match) {
            const badge = match[1].trim();
            const nameStr = match[2].trim();
            const phone = match[5].replace(/\D/g, '');

            if (!badge || !nameStr) continue;

            // Prevent duplicate names from PDF import
            const duplicateName = staff.find(s => R.sameName(s.name, nameStr) && String(s.badge) !== badge);
            if (duplicateName) {
                skipped++;
                continue;
            }

            const existing = staff.find(s => String(s.badge) === badge);

            if (existing) {
              await CSM.refs.staff(badge).update({ 
                name: nameStr, 
                phone: phone,
                updatedAt: new Date().toISOString()
              });
              updated++;
            } else {
              await CSM.refs.staff(badge).set({
                badge: badge,
                name: nameStr,
                phone: phone,
                role: 'Crew', // Default role for PDF import
                active: true,
                source: 'pdf-import',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
              });
              created++;
            }
          }
        }
      }
      
      $('loadingOverlay').classList.remove('show');
      $('btnImportBase').disabled = false;
      e.target.value = '';
      
      let msg = `Importation terminée !\n\n✅ Nouveaux : ${created}\n🔄 Mis à jour : ${updated}`;
      if(skipped > 0) msg += `\n⚠️ Ignorés (nom en double) : ${skipped}`;
      alert(msg);
      
    } catch (err) {
      console.error(err);
      $('loadingOverlay').classList.remove('show');
      $('btnImportBase').disabled = false;
      e.target.value = '';
      alert('Erreur lors de l\'importation : ' + err.message);
    }
  });

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s){ return escapeHtml(s); }

})();
</script>
</body>
</html>
