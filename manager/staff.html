<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuaire du Personnel — CSM</title>
<link rel="icon" type="image/webp" href="../shared/200.webp">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>

<div class="top-nav">
  <div class="nav-left">
    <div class="nav-brand">mngmt.tech</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">🏠 Time Punch</a>
      <a href="planning.html" class="nav-link">📅 Planning</a>
      <a href="#" class="nav-link" onclick="return false;">📈 Forecast</a>
      <a href="staff.html" class="nav-link active">👤 Staff</a>
    </div>
  </div>
  <div class="nav-right">
    <button class="nav-btn" id="btnLogout">↻ Déconnexion</button>
  </div>
</div>

<div class="container" id="app" style="display:none;">
  
  <div class="page-header">
    <div class="page-title">Annuaire du Personnel</div>
    
    <div class="flex gap-2 items-center">
      <div class="input-group" style="width: 250px; margin-right: 10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Rechercher...">
      </div>
      <button class="btn btn-primary" id="btnAdd">+ Ajouter un employé</button>
      <button class="btn btn-secondary" id="btnImportBase">Importer Excel</button>
      <input type="file" id="baseFileInput" accept="application/pdf" style="display:none;">
      <button class="btn btn-warning" id="btnImportRoles">📄 Assigner Fonctions (PDF)</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Badge ↕</th>
          <th>Nom ↕</th>
          <th>Téléphone</th>
          <th>Fonction</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="staffBody"></tbody>
    </table>
    <div id="emptyState" style="text-align:center; padding: 60px 20px; color:var(--text-muted); display:none;">
      <b>Aucun employé trouvé</b>
    </div>
  </div>
</div>

<div class="modalbg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Ajouter un employé</h3>
    <div class="sub" id="modalSub">Créez un profil.</div>
    <div class="field">
      <label>N° de badge</label>
      <input type="text" id="fBadge">
    </div>
    <div class="field">
      <label>Nom & Prénom</label>
      <input type="text" id="fName">
    </div>
    <div class="field">
      <label>Numéro de téléphone</label>
      <input type="text" id="fPhone">
    </div>
    <div class="modalactions">
      <button class="btn btn-secondary" id="btnCancel">Annuler</button>
      <button class="btn btn-primary" id="btnSave">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modalbg" id="loadingOverlay">
  <div style="background:#fff; padding:20px 30px; border-radius:6px; font-weight:600;">Lecture du fichier PDF en cours...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/rules-helpers.js"></script>
<script>
(function(){
  'use strict';
  const $ = function(id){ return document.getElementById(id); };
  if(window['pdfjsLib']){ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }

  let staff = [];
  let currentQuery = '';
  let editingBadge = null;

  auth.onAuthStateChanged(user => {
    if(!user) { window.location.replace('login.html'); return; }
    db.collection('managerRestaurants').doc(user.uid).get().then(doc => {
      if(!doc.exists) { auth.signOut(); return; }
      return CSM.ready.then(() => {
        $('app').style.display = 'block';
        CSM.refs.staffColl().onSnapshot(snap => {
          staff = snap.docs.map(d => Object.assign({ _docId: d.id }, d.data()));
          render();
        });
      });
    });
  });

  $('btnLogout').addEventListener('click', () => auth.signOut());

  function render() {
    const body = $('staffBody');
    body.innerHTML = '';
    
    let filtered = staff.filter(s => {
      if(!currentQuery) return true;
      const q = currentQuery.toLowerCase();
      return (s.name||'').toLowerCase().includes(q) || String(s.badge||'').includes(q) || String(s.phone||'').includes(q);
    });

    filtered.sort((a,b) => String(a.badge||'').localeCompare(String(b.badge||'')));

    $('emptyState').style.display = filtered.length === 0 ? 'block' : 'none';

    filtered.forEach(s => {
      let roleStr = s.role || 'Crew';
      let roleBadge = 'badge-blue';
      let isActive = s.active !== false;
      let statClass = isActive ? 'badge-green' : 'badge-red';
      let statLabel = isActive ? 'ACTIF' : 'INACTIF';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${s.badge || '—'}</td>
        <td style="font-weight:600;">${s.name || 'Sans nom'}</td>
        <td class="mono" style="color:var(--teal);">${s.phone || '—'}</td>
        <td><span class="badge ${roleBadge}">${roleStr}</span></td>
        <td><span class="badge ${statClass}">${statLabel}</span></td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="openEditModal('${s.badge}')" style="margin-right:5px;">✎</button>
          <button class="btn btn-danger btn-sm" onclick="toggleActive('${s.badge}')">🗑</button>
        </td>
      `;
      body.appendChild(tr);
    });
  }

  $('searchInput').addEventListener('input', e => { currentQuery = e.target.value; render(); });

  const modalBg = $('modalBg');
  window.openEditModal = function(badge) {
    const s = staff.find(x => String(x.badge) === String(badge));
    if(!s) return;
    editingBadge = badge;
    $('modalTitle').textContent = 'Modifier le profil';
    $('fBadge').value = s.badge || badge;
    $('fBadge').disabled = true;
    $('fName').value = s.name || '';
    $('fPhone').value = s.phone || '';
    modalBg.classList.add('show');
  };

  $('btnAdd').addEventListener('click', () => {
    editingBadge = null;
    $('modalTitle').textContent = 'Ajouter un employé';
    $('fBadge').value = ''; $('fBadge').disabled = false;
    $('fName').value = ''; $('fPhone').value = '';
    modalBg.classList.add('show');
  });

  $('btnCancel').addEventListener('click', () => modalBg.classList.remove('show'));

  $('btnSave').addEventListener('click', () => {
    const badge = $('fBadge').value.trim();
    const name = $('fName').value.trim();
    const phone = $('fPhone').value.trim();
    if(!badge || !name) { alert('Badge et Nom requis.'); return; }

    if(editingBadge) {
      CSM.refs.staff(editingBadge).update({ name, phone }).then(() => modalBg.classList.remove('show'));
    } else {
      CSM.refs.staff(badge).set({ badge, name, phone, active: true, source: 'manual', createdAt: new Date().toISOString() }).then(() => modalBg.classList.remove('show'));
    }
  });

  window.toggleActive = function(badge) {
    const s = staff.find(x => String(x.badge) === String(badge));
    if(!s) return;
    const willDeactivate = s.active !== false;
    if(confirm((willDeactivate ? 'Désactiver ' : 'Réactiver ') + s.name + ' ?')) {
      CSM.refs.staff(badge).update({ active: !willDeactivate });
    }
  };

  $('btnImportBase').addEventListener('click', () => $('baseFileInput').click());
  $('baseFileInput').addEventListener('change', async (e) => {
    if(!e.target.files[0]) return;
    $('loadingOverlay').classList.add('show');
    try {
      const pdf = await pdfjsLib.getDocument({ data: await e.target.files[0].arrayBuffer() }).promise;
      let created = 0, updated = 0;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const lineMap = new Map();
        content.items.forEach(item => {
          if (!item.str.trim()) return;
          const y = Math.round(item.transform[5]);
          if (!lineMap.has(y)) lineMap.set(y, []);
          lineMap.get(y).push(item);
        });
        const sortedY = Array.from(lineMap.keys()).sort((a, b) => b - a);
        for (const y of sortedY) {
          const rowItems = lineMap.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
          const rowString = rowItems.map(it => it.str).join(' ');
          const regex = /^(\d+)(.+?)NT\s*(\d{2}\/\d{2}\/\d{4})\s*(\d{2}:\d{2}:\d{2})([\d\s]*)$/;
          const match = regex.exec(rowString);
          if (match) {
            const badge = match[1].trim();
            const nameStr = match[2].trim();
            const phone = match[5].replace(/\D/g, '');
            const existing = staff.find(s => String(s.badge) === badge);
            if (existing) { await CSM.refs.staff(badge).update({ name: nameStr, phone }); updated++; }
            else { await CSM.refs.staff(badge).set({ badge, name: nameStr, phone, active: true, source: 'pdf-import', createdAt: new Date().toISOString() }); created++; }
          }
        }
      }
      alert(`Importation terminée !\nNouveaux : ${created}\nMis à jour : ${updated}`);
    } catch (err) { alert('Erreur : ' + err.message); }
    $('loadingOverlay').classList.remove('show'); e.target.value = '';
  });

  $('btnImportRoles').addEventListener('click', () => alert("L'importation des fonctions sera implémentée ici."));

})();
</script>
</body>
</html>
