<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D5B6E">
<title>Demandes â€” CSM Manager</title>
<link rel="icon" type="image/webp" href="../200.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
:root{
  --teal:#0D5B6E;--teal-dark:#094A5A;--teal-light:#E8F0F2;
  --gray-bg:#F2F4F5;--gray-border:#CDD3D6;--gray-muted:#5A6A70;
  --text:#1A2A30;--red:#C0392B;--green:#4C9A5D;--amber:#D68F00;--gold:#C9A227;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Space Grotesk',-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:15px;color:var(--text);background:var(--gray-bg);
  min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px));
}

.topbar{background:var(--teal);color:#FFFFFF;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;padding-top:calc(14px + env(safe-area-inset-top, 0px));}
.topbar h1{margin:0;font-size:17px;font-weight:600;flex:1;}

.page-head{padding:20px 18px 12px;}
.page-head .title{font-size:22px;font-weight:600;color:var(--text);margin:0 0 2px;}
.page-head .sub{font-size:13px;color:var(--gray-muted);}

.tabs{display:flex;gap:0;margin:0 18px 16px;border-bottom:1px solid var(--gray-border);}
.tab{background:none;border:none;padding:12px 16px;font-size:13.5px;font-family:inherit;font-weight:600;color:var(--gray-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;flex:1;justify-content:center;touch-action:manipulation;}
.tab:active{background:var(--teal-light);}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.tab .cnt{background:var(--red);color:#FFFFFF;font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 6px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;}
.tab .cnt:empty{display:none;}

.filters{display:flex;gap:6px;padding:0 18px 14px;overflow-x:auto;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{background:#FFFFFF;border:1px solid var(--gray-border);color:var(--gray-muted);padding:7px 13px;font-size:12.5px;font-family:inherit;font-weight:500;cursor:pointer;border-radius:18px;white-space:nowrap;transition:all .15s;min-height:34px;display:inline-flex;align-items:center;touch-action:manipulation;}
.chip:active{transform:scale(0.96);}
.chip.active{background:var(--teal);color:#FFFFFF;border-color:var(--teal);}

.req-list{padding:0 18px;display:flex;flex-direction:column;gap:12px;}
.req-card{background:#FFFFFF;border:1px solid var(--gray-border);border-left:4px solid var(--gray-border);padding:14px;display:flex;flex-direction:column;gap:12px;}
.req-card.pending{border-left-color:var(--amber);}
.req-card.approved{border-left-color:var(--green);}
.req-card.rejected{border-left-color:var(--red);opacity:0.85;}

.req-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.req-who{flex:1;min-width:0;}
.req-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.req-badge{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gray-muted);margin-top:2px;}
.req-when{font-size:11px;color:var(--gray-muted);font-family:'IBM Plex Mono',monospace;margin-top:4px;}

.req-status{font-size:11px;font-weight:600;padding:4px 9px;border-radius:2px;white-space:nowrap;flex-shrink:0;}
.req-status.pending{background:#FBF0D2;color:#8A5A00;}
.req-status.approved{background:#E0F1E4;color:#2F7D46;}
.req-status.rejected{background:#F7DAD5;color:#A32B1B;}

.req-body{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:10px 12px;background:#F7F9FA;border:1px solid var(--gray-border);font-size:13px;}
.req-row{display:flex;flex-direction:column;gap:2px;}
.req-row .lbl{font-size:10.5px;color:var(--gray-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.req-row .val{color:var(--text);font-weight:500;}
.req-row .val.mono{font-family:'IBM Plex Mono',monospace;}

.req-reason{padding:10px 12px;background:#FFFFFF;border-left:3px solid var(--gray-border);font-size:13px;color:var(--text);font-style:italic;line-height:1.5;}

.req-actions{display:flex;gap:8px;}
.act-btn{flex:1;padding:12px 14px;font-size:14px;font-weight:600;font-family:inherit;border:1px solid var(--gray-border);background:#FFFFFF;color:var(--text);cursor:pointer;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;transition:background .15s, transform .1s;}
.act-btn:active{transform:scale(0.97);}
.act-btn:disabled{opacity:0.5;cursor:not-allowed;}
.act-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;}
.act-btn.approve{background:var(--green);color:#FFFFFF;border-color:var(--green);}
.act-btn.approve:active{background:#3D7D4C;}
.act-btn.reject{background:#FFFFFF;color:var(--red);border-color:var(--red);}
.act-btn.reject:active{background:#F7DAD5;}

.empty{padding:60px 24px;text-align:center;color:var(--gray-muted);background:#FFFFFF;border:1px dashed var(--gray-border);margin:0 18px;font-size:14px;}
.empty svg{width:48px;height:48px;margin:0 auto 14px;stroke:var(--gray-border);stroke-width:1.5;fill:none;}
.empty b{display:block;color:var(--text);font-size:15px;font-weight:600;margin-bottom:6px;}

.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#FFFFFF;border-top:1px solid var(--gray-border);display:grid;grid-template-columns:repeat(5, 1fr);padding-bottom:env(safe-area-inset-bottom, 0px);z-index:30;box-shadow:0 -2px 8px rgba(0,0,0,0.04);}
.nav-item{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px 10px;color:var(--gray-muted);font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer;touch-action:manipulation;min-height:64px;position:relative;}
.nav-item:active{background:var(--gray-bg);}
.nav-item.active{color:var(--teal);}
.nav-item svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;}
.nav-item.active svg{stroke-width:2.4;}
.nav-item .badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#FFFFFF;font-size:9.5px;font-weight:700;min-width:16px;height:16px;padding:0 4px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF;}
.nav-item .badge.hidden{display:none;}

#loadingOverlay{position:fixed;inset:0;background:#0D5B6E;color:#fff;display:flex;align-items:center;justify-content:center;z-index:100;font-size:14px;letter-spacing:0.05em;}
#loadingOverlay.hidden{display:none;}
</style>
</head>
<body>

<div id="loadingOverlay">Chargementâ€¦</div>

<div class="topbar">
  <h1>Demandes</h1>
</div>

<div class="page-head">
  <h1 class="title">Demandes</h1>
  <div class="sub">CongÃ©s et corrections de pointage</div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="leave">CongÃ©s <span class="cnt" id="countLeave"></span></button>
  <button class="tab" data-tab="corrections">Corrections <span class="cnt" id="countCorr"></span></button>
</div>

<div id="paneLeave">
  <div class="filters">
    <button class="chip active" data-filter="pending" data-pane="leave">En attente</button>
    <button class="chip" data-filter="all" data-pane="leave">Toutes</button>
  </div>
  <div class="req-list" id="leaveList"></div>
  <div class="empty" id="leaveEmpty" style="display:none;">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
    <b>Aucune demande de congÃ© en attente</b>
    Les nouvelles demandes apparaÃ®tront ici.
  </div>
</div>

<div id="paneCorrections" style="display:none;">
  <div class="filters">
    <button class="chip active" data-filter="pending" data-pane="corrections">En attente</button>
    <button class="chip" data-filter="all" data-pane="corrections">Toutes</button>
  </div>
  <div class="req-list" id="corrList"></div>
  <div class="empty" id="corrEmpty" style="display:none;">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
    <b>Aucune correction en attente</b>
    Les demandes de correction apparaÃ®tront ici.
  </div>
</div>

<div class="bottomnav">
  <button class="nav-item" data-page="dashboard">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    <span>Pointages</span>
  </button>
  <button class="nav-item" data-page="planning">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    <span>Planning</span>
  </button>
  <button class="nav-item" data-page="staff">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
    <span>EmployÃ©s</span>
  </button>
  <button class="nav-item active" data-page="requests">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
    <span>Demandes</span>
    <span class="badge hidden" id="navBadge">0</span>
  </button>
  <button class="nav-item" data-page="daily-import">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <span>Import</span>
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/rules-helpers.js"></script>
<script>
(function(){
  'use strict';
  const $ = function(id){ return document.getElementById(id); };
  const R = window.CSMRules;

  const TYPE_LABELS = { vacation: 'CongÃ© payÃ©', sick: 'Maladie', personal: 'Personnel', other: 'Autre' };
  const FIELD_LABELS = { clockIn: 'EntrÃ©e', breakStart: 'DÃ©but de pause', breakReturn: 'Retour de pause', clockOut: 'Sortie' };
  const STATUS_LABELS = { pending: 'En attente', approved: 'ApprouvÃ©e', rejected: 'RefusÃ©e' };
  const CORR_STATUS_LABELS = { pending: 'En attente', approved: 'AppliquÃ©e', rejected: 'RefusÃ©e' };

  let leaveReqs = [];
  let corrections = [];
  let filterLeave = 'pending';
  let filterCorr = 'pending';
  let started = false;

  CSM.authReady.then(function(){
    auth.onAuthStateChanged(function(user){
      if(!user){ window.location.replace('login.html'); return; }
      if(started) return;
      started = true;
      db.collection('managerRestaurants').doc(user.uid).get().then(function(doc){
        if(!doc.exists){ auth.signOut(); return; }
        CSM.ready.then(startLive);
      }).catch(function(){ CSM.ready.then(startLive); });
    });
  });

  function startLive(){
    $('loadingOverlay').classList.add('hidden');

    CSM.refs.leaveReqs().orderBy('requestedAt', 'desc').onSnapshot(function(snap){
      leaveReqs = snap.docs.map(function(d){ return Object.assign({ _id: d.id }, d.data()); });
      updateCounts(); renderLeave();
    }, function(err){ console.error(err); });

    CSM.refs.corrections().orderBy('requestedAt', 'desc').onSnapshot(function(snap){
      corrections = snap.docs.map(function(d){ return Object.assign({ _id: d.id }, d.data()); });
      updateCounts(); renderCorr();
    }, function(err){ console.error(err); });
  }

  function updateCounts(){
    const pl = leaveReqs.filter(function(r){ return r.status === 'pending'; }).length;
    const pc = corrections.filter(function(r){ return r.status === 'pending'; }).length;
    $('countLeave').textContent = pl > 0 ? pl : '';
    $('countCorr').textContent = pc > 0 ? pc : '';
    const total = pl + pc;
    $('navBadge').textContent = total > 0 ? total : '';
    $('navBadge').classList.toggle('hidden', total === 0);
  }

  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      const tab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x === t); });
      $('paneLeave').style.display = tab === 'leave' ? 'block' : 'none';
      $('paneCorrections').style.display = tab === 'corrections' ? 'block' : 'none';
    });
  });

  document.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      const pane = chip.dataset.pane;
      document.querySelectorAll('.chip[data-pane="'+pane+'"]').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      if(pane === 'leave'){ filterLeave = chip.dataset.filter; renderLeave(); }
      else { filterCorr = chip.dataset.filter; renderCorr(); }
    });
  });

  function renderLeave(){
    const list = $('leaveList');
    const empty = $('leaveEmpty');
    list.innerHTML = '';
    let arr = leaveReqs.slice();
    if(filterLeave === 'pending') arr = arr.filter(function(r){ return r.status === 'pending'; });

    if(arr.length === 0){
      list.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    list.style.display = 'flex';
    empty.style.display = 'none';
    arr.forEach(function(r){ list.appendChild(buildLeaveCard(r)); });
  }

  function buildLeaveCard(r){
    const card = document.createElement('div');
    card.className = 'req-card ' + (r.status || 'pending');
    const statusLabel = STATUS_LABELS[r.status] || r.status;
    const typeLabel = TYPE_LABELS[r.type] || r.type;
    const when = formatRelative(r.requestedAt);
    let days = 'â€”';
    if(r.fromDate && r.toDate){
      const d1 = new Date(r.fromDate + 'T00:00:00Z');
      const d2 = new Date(r.toDate + 'T00:00:00Z');
      const n = Math.round((d2 - d1) / 86400000) + 1;
      days = n + (n > 1 ? ' jours' : ' jour');
    }

    let html = '';
    html += '<div class="req-head">';
    html += '<div class="req-who">';
    html += '<div class="req-name">' + escapeHtml(r.name || 'EmployÃ©') + '</div>';
    html += '<div class="req-badge">Badge ' + escapeHtml(r.badge || 'â€”') + '</div>';
    html += '<div class="req-when">' + escapeHtml(when) + '</div>';
    html += '</div>';
    html += '<span class="req-status ' + r.status + '">' + escapeHtml(statusLabel) + '</span>';
    html += '</div>';

    html += '<div class="req-body">';
    html += '<div class="req-row"><span class="lbl">Type</span><span class="val">' + escapeHtml(typeLabel) + '</span></div>';
    html += '<div class="req-row"><span class="lbl">DurÃ©e</span><span class="val">' + escapeHtml(days) + '</span></div>';
    html += '<div class="req-row"><span class="lbl">Du</span><span class="val mono">' + escapeHtml(r.fromDate || 'â€”') + '</span></div>';
    html += '<div class="req-row"><span class="lbl">Au</span><span class="val mono">' + escapeHtml(r.toDate || 'â€”') + '</span></div>';
    html += '</div>';

    if(r.reason){
      html += '<div class="req-reason">Â« ' + escapeHtml(r.reason) + ' Â»</div>';
    }

    if(r.status === 'pending'){
      html += '<div class="req-actions">';
      html += '<button class="act-btn approve" data-act="approve" data-id="' + escapeHtml(r._id) + '">';
      html += '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Approuver</button>';
      html += '<button class="act-btn reject" data-act="reject" data-id="' + escapeHtml(r._id) + '">';
      html += '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>Refuser</button>';
      html += '</div>';
    }

    card.innerHTML = html;
    card.querySelectorAll('.act-btn[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        decideLeave(btn.dataset.id, btn.dataset.act === 'approve');
      });
    });
    return card;
  }

  function renderCorr(){
    const list = $('corrList');
    const empty = $('corrEmpty');
    list.innerHTML = '';
    let arr = corrections.slice();
    if(filterCorr === 'pending') arr = arr.filter(function(r){ return r.status === 'pending'; });

    if(arr.length === 0){
      list.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    list.style.display = 'flex';
    empty.style.display = 'none';
    arr.forEach(function(r){ list.appendChild(buildCorrCard(r)); });
  }

  function buildCorrCard(r){
    const card = document.createElement('div');
    card.className = 'req-card ' + (r.status || 'pending');
    const statusLabel = CORR_STATUS_LABELS[r.status] || r.status;
    const fieldLabel = FIELD_LABELS[r.field] || r.field;
    const when = formatRelative(r.requestedAt);

    let html = '';
    html += '<div class="req-head">';
    html += '<div class="req-who">';
    html += '<div class="req-name">' + escapeHtml(r.name || 'EmployÃ©') + '</div>';
    html += '<div class="req-badge">Badge ' + escapeHtml(r.badge || 'â€”') + '</div>';
    html += '<div class="req-when">' + escapeHtml(when) + '</div>';
    html += '</div>';
    html += '<span class="req-status ' + r.status + '">' + escapeHtml(statusLabel) + '</span>';
    html += '</div>';

    html += '<div class="req-body">';
    html += '<div class="req-row"><span class="lbl">Date</span><span class="val mono">' + escapeHtml(r.date || 'â€”') + '</span></div>';
    html += '<div class="req-row"><span class="lbl">Champ</span><span class="val">' + escapeHtml(fieldLabel) + '</span></div>';
    html += '<div class="req-row" style="grid-column:1 / -1;"><span class="lbl">Nouvelle valeur</span><span class="val mono">' + escapeHtml(r.requestedValue || 'â€”') + '</span></div>';
    html += '</div>';

    if(r.reason){
      html += '<div class="req-reason">Â« ' + escapeHtml(r.reason) + ' Â»</div>';
    }

    if(r.status === 'pending'){
      html += '<div class="req-actions">';
      html += '<button class="act-btn approve" data-act="approve" data-id="' + escapeHtml(r._id) + '">';
      html += '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Appliquer</button>';
      html += '<button class="act-btn reject" data-act="reject" data-id="' + escapeHtml(r._id) + '">';
      html += '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>Refuser</button>';
      html += '</div>';
    }

    card.innerHTML = html;
    card.querySelectorAll('.act-btn[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        decideCorr(btn.dataset.id, btn.dataset.act === 'approve');
      });
    });
    return card;
  }

  function decideLeave(id, approve){
    const req = leaveReqs.find(function(r){ return r._id === id; });
    if(!req) return;
    const verb = approve ? 'approuver' : 'refuser';
    if(!confirm('Voulez-vous ' + verb + ' cette demande de congÃ© ?')) return;
    CSM.refs.leaveReqs().doc(id).update({
      status: approve ? 'approved' : 'rejected',
      decidedAt: new Date().toISOString(),
      decidedBy: auth.currentUser ? auth.currentUser.uid : null
    }).then(function(){
      writeAudit('leave.' + (approve ? 'approved' : 'rejected'), id, {
        badge: req.badge, fromDate: req.fromDate, toDate: req.toDate
      });
    }).catch(function(err){ alert('Erreur : ' + err.message); });
  }

  async function decideCorr(id, apply){
    const req = corrections.find(function(r){ return r._id === id; });
    if(!req) return;

    if(!apply){
      if(!confirm('Refuser cette correction ?')) return;
      CSM.refs.corrections().doc(id).update({
        status: 'rejected',
        decidedAt: new Date().toISOString(),
        decidedBy: auth.currentUser ? auth.currentUser.uid : null
      }).catch(function(err){ alert('Erreur : ' + err.message); });
      return;
    }

    if(!confirm('Appliquer cette correction au pointage ?')) return;
    const badge = String(req.badge || '');
    const date = req.date;
    if(!badge || !date){ alert('DonnÃ©es manquantes.'); return; }

    try{
      const snap = await CSM.refs.shifts().where('badge', '==', badge).where('date', '==', date).limit(1).get();
      if(snap.empty){ alert('Aucun pointage trouvÃ© pour ce badge Ã  cette date.'); return; }
      const shiftDoc = snap.docs[0];
      const before = shiftDoc.data();
      const newVal = R.hmToMin(req.requestedValue);
      if(newVal === null){ alert('Valeur invalide : ' + req.requestedValue); return; }
      const patch = {};
      patch[req.field] = newVal;
      const merged = Object.assign({}, before, patch);
      patch.totalMinutes = R.computeShift(merged).totalMinutes;
      patch.updatedAt = new Date().toISOString();
      await shiftDoc.ref.update(patch);
      await CSM.refs.corrections().doc(id).update({
        status: 'approved',
        decidedAt: new Date().toISOString(),
        decidedBy: auth.currentUser ? auth.currentUser.uid : null,
        appliedTo: shiftDoc.id
      });
      writeAudit('correction.applied', shiftDoc.id, {
        badge: badge, date: date, field: req.field, before: before[req.field], after: newVal
      });
    }catch(err){
      console.error(err);
      alert('Erreur : ' + err.message);
    }
  }

  function writeAudit(action, targetId, details){
    CSM.refs.auditLog().add({
      actor: auth.currentUser ? auth.currentUser.uid : 'unknown',
      action: action,
      target: targetId,
      details: details || {},
      at: new Date().toISOString()
    }).catch(function(err){ console.warn(err); });
  }

  function formatRelative(iso){
    if(!iso) return '';
    try{
      const then = new Date(iso).getTime();
      const diff = Math.floor((Date.now() - then) / 1000);
      if(diff < 60) return "Ã  l'instant";
      if(diff < 3600) return 'il y a ' + Math.floor(diff / 60) + ' min';
      if(diff < 86400) return 'il y a ' + Math.floor(diff / 3600) + 'h';
      if(diff < 604800) return 'il y a ' + Math.floor(diff / 86400) + 'j';
      const d = new Date(iso);
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }catch(e){ return ''; }
  }

  document.querySelectorAll('.nav-item').forEach(function(item){
    item.addEventListener('click', function(){
      const page = item.dataset.page;
      if(page === 'requests') return;
      if(page === 'dashboard') return window.location.href = '../index.html';
      if(page === 'planning')  return window.location.href = 'planing.html';
      if(page === 'staff')     return window.location.href = 'staff.html';
      if(page === 'daily-import')      return window.location.href = 'daily-import.html';
    });
  });

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
})();
</script>
